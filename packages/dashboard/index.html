<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Control</title>
<style>
:root {
  --bg: #0b0d10; --panel: #12151a; --panel2: #171b21; --line: #232832; --text: #d9dee7; --dim: #7d8696; --faint: #4a5160;
  --gold: #e3b341; --green: #3fb950; --red: #f85149; --blue: #58a6ff; --violet: #b392f0; --teal: #39c5bb;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 var(--sans); }
a { color: var(--blue); text-decoration: none; }
header { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #11141a, #0b0d10); position: sticky; top: 0; z-index: 5; }
.brand { font-weight: 800; letter-spacing: .14em; color: var(--gold); font-size: 14px; }
.brand small { color: var(--dim); font-weight: 500; letter-spacing: .04em; margin-left: 8px; }
.kpis { display: flex; gap: 14px; margin-left: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; min-width: 92px; }
.kpi b { display: block; font: 600 16px var(--mono); }
.kpi span { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.links { margin-left: auto; display: flex; gap: 12px; font-size: 12px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: p 2s infinite; display: inline-block; }
@keyframes p { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.6); } 70% { box-shadow: 0 0 0 8px rgba(63,185,80,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); } }
main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card h2 { margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--gold); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
td { padding: 7px 10px; border-bottom: 1px solid #1a1e25; white-space: nowrap; }
tr.row { cursor: pointer; }
tr.row:hover { background: #161a20; }
tr.sel { background: #1d1a10 !important; box-shadow: inset 3px 0 0 var(--gold); }
.name { font-weight: 600; }
.role { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #1e2430; color: var(--violet); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
.on { background: var(--green); } .idle { background: var(--gold); } .off { background: var(--faint); }
.dim { color: var(--dim); } .mono { font-family: var(--mono); font-size: 12px; }
.bar { width: 64px; height: 6px; background: #222832; border-radius: 3px; display: inline-block; vertical-align: middle; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold) 50%, var(--green)); }
.tablewrap { max-height: 46vh; overflow: auto; }
.detail { padding: 12px; }
.dhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dhead h3 { margin: 0; font-size: 18px; }
.chips { display: flex; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; font-size: 12px; }
.chip b { font-family: var(--mono); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.sk { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; display: flex; justify-content: space-between; font-size: 11.5px; position: relative; overflow: hidden; }
.sk b { font-family: var(--mono); }
.sk.max { border-color: #5a4a14; color: var(--gold); }
.sk i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--teal); opacity: .7; }
.pack { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; font-size: 10.5px; height: 34px; overflow: hidden; }
.slot b { display: block; font-family: var(--mono); color: var(--gold); font-size: 10px; }
.empty { opacity: .3; }
.sub { font-size: 10.5px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; margin: 10px 0 5px; }
.list { max-height: 150px; overflow: auto; font-size: 12px; }
.list div { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed #1c2028; }
iframe.viewer { width: 100%; height: 300px; border: 1px solid var(--line); border-radius: 8px; background: #000; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 12px; color: var(--dim); cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent; }
.tab.act { color: var(--text); border-color: var(--gold); }
.pane { display: none; } .pane.act { display: block; }
#map { width: 100%; height: 520px; display: block; background: radial-gradient(ellipse at 40% 40%, #12202a, #090b0e 70%); }
iframe.full { width: 100%; height: 640px; border: 0; background: #000; }
.bottom { padding: 0 16px 16px; }
.ranks td { padding: 3px 6px; font-size: 12px; }
.r1 { color: var(--gold); font-weight: 700; }
.tag { font-size: 10px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="brand">SWARM CONTROL <small>rs-sdk demo · Haggis project</small></div>
  <div class="kpis">
    <div class="kpi"><b id="k-world">0</b><span>in world</span></div>
    <div class="kpi"><b id="k-total">0</b><span>accounts</span></div>
    <div class="kpi"><b id="k-99">0</b><span>99s</span></div>
    <div class="kpi"><b id="k-best">-</b><span>best rank</span></div>
    <div class="kpi"><b id="k-players">0</b><span>players online</span></div>
  </div>
  <div class="links"><span class="pulse" title="live"></span>
    <a href="https://rs-sdk-demo.fly.dev/mapview/" target="_blank">Live map</a>
    <a href="http://localhost:3000/?live=wss://rs-sdk-demo.fly.dev/worldfeed" target="_blank">rs-world</a>
    <a href="https://rs-sdk-demo.fly.dev/hiscores" target="_blank">Hiscores</a>
    <a href="https://rs-sdk-demo.fly.dev/market" target="_blank">Market</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>Accounts <span class="tag" id="updated"></span></h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Account</th><th>Role</th><th>State</th><th>Phase</th><th>Goal</th><th>HP</th><th>Top skill</th><th>Idle</th><th>Where</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <section class="card"><h2>Account</h2><div class="detail" id="detail"><span class="dim">Pick an account.</span></div></section>
</main>
<div class="bottom"><section class="card">
  <div class="tabs">
    <div class="tab act" data-p="p-map">World map</div>
    <div class="tab" data-p="p-live">Live map</div>
    <div class="tab" data-p="p-hs">Hiscores</div>
    <div class="tab" data-p="p-mk">Market</div>
  </div>
  <div class="pane act" id="p-map"><canvas id="map"></canvas></div>
  <div class="pane" id="p-live"><iframe class="full" data-src="https://rs-sdk-demo.fly.dev/mapview/"></iframe></div>
  <div class="pane" id="p-hs"><iframe class="full" data-src="https://rs-sdk-demo.fly.dev/hiscores"></iframe></div>
  <div class="pane" id="p-mk"><iframe class="full" data-src="https://rs-sdk-demo.fly.dev/market"></iframe></div>
</section></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = ms => ms < 60e3 ? `${Math.round(ms / 1e3)}s` : ms < 3600e3 ? `${Math.round(ms / 60e3)}m` : `${(ms / 3600e3).toFixed(1)}h`;
let S = { bots: [] }, sel = null, viewerFor = null;

const PLACES = [['Lumbridge', 3222, 3218], ['Varrock', 3212, 3428], ['Draynor', 3093, 3244], ['Port Sarim', 3029, 3217], ['Falador', 2965, 3380],
  ['Ardougne', 2662, 3305], ['Brimhaven', 2760, 3180], ['Musa Point', 2920, 3160], ['Catherby', 2810, 3435], ['Seers', 2725, 3485],
  ['Baxtorian Falls', 2521, 3495], ['GE', 3181, 3443], ['Al Kharid', 3293, 3175], ['Barbarian Vil.', 3082, 3420]];
const B = { x0: 2440, x1: 3360, z0: 3080, z1: 3560 };

function state(b) {
  if (b.inWorld && b.fresh) return ['on', 'playing'];
  if (b.inWorld) return ['idle', 'in world'];
  if (b.fresh) return ['idle', 'local'];
  return ['off', 'offline'];
}
function topSkill(b) {
  const s = (b.skills || []).filter(k => k.name !== 'Hitpoints').sort((a, c) => c.xp - a.xp)[0];
  return s ? `${s.name} <b class="mono">${s.level}</b>` : '<span class="dim">-</span>';
}
function idlePct(b) {
  const l = b.ledger; if (!l) return '<span class="dim">-</span>';
  const t = Object.values(l).reduce((a, c) => a + c, 0); if (!t) return '-';
  const p = 100 * (l.idle || 0) / t; return `<span style="color:${p < 10 ? 'var(--green)' : p < 30 ? 'var(--gold)' : 'var(--red)'}">${p.toFixed(0)}%</span>`;
}
function render() {
  const bots = S.bots;
  $('#k-world').textContent = bots.filter(b => b.inWorld).length;
  $('#k-total').textContent = bots.length;
  $('#k-players').textContent = S.worldPlayers || 0;
  $('#k-99').textContent = bots.reduce((n, b) => n + (b.skills || []).filter(k => k.level >= 99).length, 0);
  const best = bots.flatMap(b => (b.ranks || []).filter(r => r.board !== 'Overall').map(r => Number(String(r.rank).replace(/,/g, '')))).filter(n => n > 0).sort((a, c) => a - c)[0];
  $('#k-best').textContent = best ? `#${best}` : '-';
  $('#updated').textContent = `updated ${new Date(S.now).toLocaleTimeString()}`;
  $('#rows').innerHTML = bots.map(b => {
    const [cls, txt] = state(b); const hp = b.hp ? Math.round(100 * b.hp.now / Math.max(1, b.hp.max)) : 0;
    const where = b.live ? `${b.live.x},${b.live.z}` : b.pos ? `${b.pos.x},${b.pos.z}` : '-';
    return `<tr class="row ${sel === b.name ? 'sel' : ''}" data-n="${esc(b.name)}"><td class="name">${esc(b.name)}</td><td><span class="role">${esc(b.role)}</span></td>
      <td><span class="dot ${cls}"></span>${txt}</td><td>${esc(b.phase || '-')} <span class="dim">· ${ago(S.now - b.at)}</span></td>
      <td class="dim">${esc((b.goal || '').replace(/\.ts$/, ''))}${b.env?.target ? ` → ${esc(b.env.target)}` : ''}</td>
      <td>${b.hp ? `<span class="bar"><i style="width:${hp}%"></i></span> <span class="mono dim">${b.hp.now}/${b.hp.max}</span>` : '-'}</td>
      <td>${topSkill(b)}</td><td>${idlePct(b)}</td><td class="mono dim">${where}</td></tr>`;
  }).join('') || '<tr><td colspan="9" class="dim">No bots have reported yet. Start one: its status appears here within 5 ticks.</td></tr>';
  document.querySelectorAll('tr.row').forEach(r => r.onclick = () => { sel = r.dataset.n; render(); });
  if (!sel && bots[0]) sel = bots[0].name;
  renderDetail(bots.find(b => b.name === sel));
  drawMap();
}
function renderDetail(b) {
  if (!b) return;
  const total = (b.skills || []).reduce((n, k) => n + k.level, 0);
  const skills = (b.skills || []).map(k => {
    const frac = k.level >= 99 ? 1 : (k.level - 1) / 98;
    return `<div class="sk ${k.level >= 99 ? 'max' : ''}"><span>${esc(k.name)}</span><b>${k.level}</b><i style="width:${(frac * 100).toFixed(0)}%"></i></div>`;
  }).join('');
  const inv = b.inventory || [];
  const pack = Array.from({ length: 28 }, (_, i) => inv[i] ? `<div class="slot"><b>${inv[i].count > 1 ? inv[i].count.toLocaleString() : ''}</b>${esc(inv[i].name)}</div>` : '<div class="slot empty"></div>').join('');
  const bank = b.bank ? b.bank.slice(0, 200).map(i => `<div><span>${esc(i.name)}</span><span class="mono">${i.count.toLocaleString()}</span></div>`).join('') : '<span class="dim">Not seen yet (shows after the bot opens its bank).</span>';
  const ranks = (b.ranks || []).length ? `<table class="ranks">${b.ranks.map(r => `<tr><td>${esc(r.board)}</td><td class="mono ${r.rank === '1' ? 'r1' : ''}">#${esc(r.rank)}</td><td class="mono">${esc(r.level)}</td><td class="mono dim">${esc(r.time)}</td></tr>`).join('')}</table>` : '<span class="dim">No live ranks yet.</span>';
  const l = b.ledger || {}; const lt = Object.values(l).reduce((a, c) => a + c, 0) || 1;
  const led = ['xp', 'move', 'anim', 'dialog', 'stun', 'idle'].map(k => `<span class="chip">${k} <b>${(100 * (l[k] || 0) / lt).toFixed(0)}%</b></span>`).join('');
  $('#detail').innerHTML = `<div class="dhead"><h3>${esc(b.name)}</h3><span class="role">${esc(b.role)}</span><span class="dim">${esc(b.server)}</span></div>
    <div class="chips"><span class="chip">phase <b>${esc(b.phase || '-')}</b></span><span class="chip">goal <b>${esc((b.goal || '').replace(/\.ts$/, ''))}${b.env?.target ? ' → ' + esc(b.env.target) : ''}</b></span>
      <span class="chip">combat <b>${b.combat ?? '-'}</b></span><span class="chip">total <b>${total}</b></span><span class="chip">HP <b>${b.hp ? b.hp.now + '/' + b.hp.max : '-'}</b></span><span class="chip">tick <b>${b.tick ?? '-'}</b></span></div>
    <div class="sub">Tick ledger</div><div class="chips">${led}</div>
    ${b.result ? `<div class="sub">Last result</div><div class="mono dim" style="white-space:normal">${esc(b.result)}</div>` : ''}
    <div class="grid2"><div><div class="sub">Skills</div><div class="skills">${skills}</div></div>
      <div><div class="sub">Pack</div><div class="pack">${pack}</div></div></div>
    <div class="grid2"><div><div class="sub">Bank</div><div class="list">${bank}</div></div><div><div class="sub">Live ranks</div><div class="list">${ranks}</div></div></div>
    <div class="sub">rs-world · following ${esc(b.name)}</div><iframe class="viewer" id="viewer"></iframe>`;
  const v = document.getElementById('viewer');
  if (viewerFor !== b.name || !v.src) { v.src = `http://localhost:3000/?live=wss://rs-sdk-demo.fly.dev/worldfeed&follow=${encodeURIComponent(b.name)}`; viewerFor = b.name; }
}
function drawMap() {
  const c = $('#map'); const w = c.clientWidth, h = c.clientHeight; if (c.width !== w) { c.width = w; c.height = h; }
  const g = c.getContext('2d'); g.clearRect(0, 0, w, h);
  const X = x => (x - B.x0) / (B.x1 - B.x0) * w, Z = z => h - (z - B.z0) / (B.z1 - B.z0) * h;
  g.strokeStyle = '#18202a'; g.lineWidth = 1;
  for (let x = Math.ceil(B.x0 / 64) * 64; x < B.x1; x += 64) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), h); g.stroke(); }
  for (let z = Math.ceil(B.z0 / 64) * 64; z < B.z1; z += 64) { g.beginPath(); g.moveTo(0, Z(z)); g.lineTo(w, Z(z)); g.stroke(); }
  g.font = '11px Inter, system-ui'; g.fillStyle = '#4a5568';
  for (const [n, x, z] of PLACES) { g.fillRect(X(x) - 1.5, Z(z) - 1.5, 3, 3); g.fillText(n, X(x) + 5, Z(z) + 4); }
  for (const b of S.bots) {
    const p = b.live || b.pos; if (!p || p.z > 6400) continue;
    const [cls] = state(b); const col = cls === 'on' ? '#3fb950' : cls === 'idle' ? '#e3b341' : '#4a5160';
    g.beginPath(); g.arc(X(p.x), Z(p.z), sel === b.name ? 7 : 5, 0, 7); g.fillStyle = col; g.fill();
    if (sel === b.name) { g.strokeStyle = '#e3b341'; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = '#d9dee7'; g.font = '600 11px Inter, system-ui'; g.fillText(b.name, X(p.x) + 9, Z(p.z) - 6);
  }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('act', x === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('act', p.id === t.dataset.p));
  const f = document.querySelector(`#${t.dataset.p} iframe`); if (f && !f.src) f.src = f.dataset.src;
  if (t.dataset.p === 'p-map') drawMap();
});
$('#map').addEventListener('click', e => {
  const c = $('#map'), r = c.getBoundingClientRect(), w = c.clientWidth, h = c.clientHeight;
  const X = x => (x - B.x0) / (B.x1 - B.x0) * w, Z = z => h - (z - B.z0) / (B.z1 - B.z0) * h;
  let best = null, bd = 400;
  for (const b of S.bots) { const p = b.live || b.pos; if (!p) continue; const d = (X(p.x) - (e.clientX - r.left)) ** 2 + (Z(p.z) - (e.clientY - r.top)) ** 2; if (d < bd) { bd = d; best = b.name; } }
  if (best) { sel = best; render(); }
});
window.addEventListener('resize', drawMap);
const es = new EventSource('/events');
es.onmessage = e => { S = JSON.parse(e.data); render(); };
</script>
</body>
</html>
