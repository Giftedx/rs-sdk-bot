<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#090806;--p1:#12100c;--p2:#1a1711;--p3:#221e16;--ln:#2a2419;--ln2:#3a3222;--tx:#ece2c6;--dm:#9a8c6e;--fa:#5a5040;
--gold:#e9b949;--gold2:#a07b2a;--parch:#d9c48f;--grn:#7ed36a;--red:#ec5a40;--blu:#6ea9ea;--tea:#4fc9b2;--vio:#b590f2;--org:#f0943c;
--ui:"Barlow Semi Condensed",system-ui,sans-serif;--mono:"Barlow Semi Condensed",system-ui,sans-serif;--rs:Cinzel,Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.25 var(--ui);overflow:hidden}
body{background:radial-gradient(ellipse at 50% -20%,#2a210f55,transparent 60%),var(--bg)}
.app{display:grid;grid-template-rows:40px 26px minmax(0,1fr);height:100vh;gap:5px;padding:0 6px 6px}
.mono{font-family:var(--ui);font-variant-numeric:tabular-nums}.dm{color:var(--dm)}.fa{color:var(--fa)}.g{color:var(--gold)}.up{color:var(--grn)}.dn{color:var(--red)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* header */
header{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ln);padding:0 4px}
.brand{font:800 17px var(--rs);letter-spacing:.12em;color:var(--gold);text-shadow:0 0 18px #e9b94933;white-space:nowrap}
.brand small{font:500 11px var(--ui);color:var(--dm);letter-spacing:.04em;margin-left:8px}
.kpis{display:flex;gap:0;margin-left:4px}
.kpi{padding:1px 9px;border-left:1px solid var(--ln);min-width:62px}.kpi b{display:block;font:700 14px var(--mono);color:var(--tx);line-height:1.15;white-space:nowrap}
.kpi span{font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dm);white-space:nowrap}.kpi.gd b{color:var(--gold)}
.links{margin-left:auto;display:flex;gap:12px;align-items:center;font-weight:600}.links a{color:var(--parch);text-decoration:none;border-bottom:1px dotted var(--gold2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:pl 2s infinite}.pulse.off{background:var(--red);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 #7ed36aaa}70%{box-shadow:0 0 0 7px #7ed36a00}100%{box-shadow:0 0 0 0 #7ed36a00}}
/* alerts */
.alerts{display:flex;gap:5px;align-items:center;overflow:hidden;white-space:nowrap}
.alerts .lbl{font:700 11px var(--rs);letter-spacing:.14em;color:var(--parch);margin-right:2px}
.al{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--ln2);background:var(--p1);border-radius:4px;padding:1px 7px;font-size:12px;cursor:pointer;flex:none}
.al:hover{border-color:var(--gold2)}.al .t{font:700 11px var(--ui);letter-spacing:.1em;padding:0 4px;border-radius:2px;color:#120e06}
.al.death .t{background:var(--red)}.al.stuck .t{background:var(--org)}.al.idle .t{background:#e86a8a}.al.logout .t{background:var(--vio)}
.allclear{color:var(--grn);font-size:12px}
/* layout */
.grid{display:grid;grid-template-columns:400px minmax(0,1fr) 470px;gap:6px;min-height:0}
.col{display:flex;flex-direction:column;gap:6px;min-height:0}
.card{background:linear-gradient(180deg,#15120d,#100e0a);border:1px solid var(--ln);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,#e9b94944,transparent)}
.card>h2{margin:0;padding:4px 9px 3px;font:700 11px var(--rs);letter-spacing:.14em;color:var(--parch);border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center;flex:none;white-space:nowrap}
.card>h2 em{font:500 11px var(--ui);font-style:normal;margin-left:auto;color:var(--dm);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow:auto;min-height:0;flex:1}
.scroll::-webkit-scrollbar,.bankg::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb,.bankg::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}
.sub{font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dm);display:flex;justify-content:space-between;gap:6px;margin:0 0 2px;white-space:nowrap}
/* shared marks */
.lb{display:flex;height:6px;border-radius:2px;overflow:hidden;background:#221d14;flex:none}.lb i{display:block;height:100%}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}.on{background:var(--grn);box-shadow:0 0 6px var(--grn)}.wd{background:var(--gold)}.off{background:var(--fa)}
.pill{font:600 11px var(--ui);padding:0 5px;border-radius:3px;line-height:15px;background:#2a2312;color:var(--parch);letter-spacing:.03em;white-space:nowrap;flex:none}
.pill.inf{background:#10241f;color:var(--tea);font-style:italic}.pill.res{background:#3a2a0c;color:var(--gold)}.pill.bk{background:#26173a;color:var(--vio)}
.job{font:600 11px var(--ui);padding:0 5px;border-radius:3px;line-height:15px;border:1px solid;white-space:nowrap;flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.job.running{color:var(--grn);border-color:#3d6b33}.job.disabled{color:var(--dm);border-color:var(--ln2)}.job.ended{color:var(--org);border-color:#6b4520}.job.external{color:var(--blu);border-color:#2f4a6b}.job.waiting,.job.starting,.job.stopping{color:var(--vio);border-color:#4a3570}
.act{font:600 11px var(--mono);padding:0 5px;border-radius:3px;line-height:15px;color:#111;flex:none}
.oc{font:700 11px var(--mono);width:14px;text-align:center;flex:none}.oc.ok{color:var(--grn)}.oc.fail{color:var(--red)}.oc.died{color:#fff;background:var(--red);border-radius:2px}
/* roster */
.bot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:4px 8px 4px 10px;border-bottom:1px solid #1d1912;cursor:pointer;position:relative}
.bot:hover{background:#1a160f}.sel{background:linear-gradient(90deg,#2a2110,#14110b 70%)!important}.bot.sel::after,.off1.sel::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.bot.idle::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--red)}
.bot .l,.bot .r{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}.bot .r{justify-content:flex-end}
.nm{font-weight:700;font-size:14px}
.gbar{position:relative;flex:1;height:14px;background:#221d14;border-radius:2px;overflow:hidden;min-width:0}.gbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5c4614,var(--gold2))}
.gbar span{position:relative;font:600 11px var(--mono);padding:0 5px;line-height:14px;color:var(--tx);text-shadow:0 1px 0 #000;white-space:nowrap}
.since{color:var(--dm);font-family:var(--mono);font-size:11px;flex:none}.idl{font:700 11px var(--mono)}.idl.bad{color:var(--red)}.idl.ok{color:var(--grn)}
.pace{font:600 11px var(--mono);flex:none}
.why{font:600 11px var(--ui);letter-spacing:.04em;color:#120e06;background:var(--parch);border-radius:3px;padding:0 5px;line-height:14px;white-space:nowrap;flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.off1{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 10px;border-bottom:1px solid #1a1610;cursor:pointer;position:relative;white-space:nowrap;color:var(--dm);font-size:12.5px}
.off1:hover{background:#17130d}.off1 .nm{font-size:13px;color:#b3a786;font-weight:600}.off1 .note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--fa)}
.grp{font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--fa);padding:3px 10px 1px;border-bottom:1px solid #1a1610}
#tip{position:fixed;z-index:9;pointer-events:none;background:#0d0b08f5;border:1px solid var(--gold2);border-radius:6px;padding:6px 9px;display:none;max-width:420px;box-shadow:0 8px 30px #000c;font-size:12px}
#tip td{padding:1px 6px;font:12px var(--mono)}#tip .w{color:var(--red);font-weight:700;margin-top:4px}
/* practice */
.prac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:4px 6px}
.pc{display:flex;align-items:center;gap:4px;background:var(--p2);border:1px solid var(--ln);border-radius:3px;padding:1px 4px;font-size:11.5px;cursor:pointer;min-width:0}
.pc .gb{flex:1;height:3px;background:#221d14;border-radius:2px;overflow:hidden;min-width:12px}.pc .gb i{display:block;height:100%;background:var(--gold2)}
/* requests */
.rq{padding:4px 8px;display:flex;flex-direction:column;gap:3px;min-height:0;flex:1}
.seg{display:flex;height:16px;border-radius:3px;overflow:hidden;font:700 11px var(--ui);flex:none}.seg i{display:flex;align-items:center;justify-content:center;font-style:normal;color:#120e06;white-space:nowrap;overflow:hidden}
.k-DONE{background:#4f8f43}.k-PARTIAL{background:#c99a3a}.k-NOT{background:#c4513c}.k-BLOCKED{background:#8a63c9}.k-NEW{background:#4aa3c9}.k-RULE{background:#5a5040}
.rqi{display:grid;grid-template-columns:22px 62px minmax(0,1fr);gap:5px;font-size:12px;border-bottom:1px dashed #241f15;align-items:center;white-space:nowrap}
.rqi .st{font:700 11px var(--ui);letter-spacing:.06em;border-radius:2px;text-align:center;color:#120e06;line-height:14px}
/* machine */
.mach{padding:4px 9px;display:flex;flex-direction:column;gap:3px;min-height:0;flex:1}
.bar{display:grid;grid-template-columns:40px minmax(0,1fr) 88px;gap:6px;align-items:center;font-size:12px}
.bar .tr{height:7px;background:#221d14;border-radius:2px;overflow:hidden}.bar .tr i{display:block;height:100%}
.proc{display:grid;grid-template-columns:minmax(0,1fr) 50px 56px 52px;gap:4px;font-size:11.5px;border-bottom:1px solid #1b1710}
/* map */
.mapwrap{position:relative;flex:1;min-height:0;background:#050504}
#map{width:100%;height:100%;display:none;cursor:crosshair}#rsw{width:100%;height:100%;border:0;display:block;background:#000}
.mapwrap.d2 #map{display:block}.mapwrap.d2 #rsw{display:none}
.tog{display:flex;border:1px solid var(--ln2);border-radius:4px;overflow:hidden}.tog button{background:none;border:0;color:var(--dm);font:700 11px var(--ui);letter-spacing:.08em;padding:1px 9px;cursor:pointer}
.tog button.on{background:var(--gold);color:#1a1408}
.legend{position:absolute;right:8px;bottom:8px;display:flex;gap:10px;font-size:11px;color:var(--dm);background:#090806cc;padding:3px 8px;border-radius:4px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.follow{position:absolute;left:8px;bottom:8px;background:#090806d0;border:1px solid var(--gold2);border-radius:4px;padding:2px 9px;font:600 12px var(--ui);color:var(--parch);pointer-events:none}
/* boards */
.boards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:4px 5px 3px}
.bd{background:var(--p2);border:1px solid var(--ln);border-radius:4px;padding:2px 6px 3px;min-width:0;cursor:default}
.bd.win{border-color:var(--gold);box-shadow:inset 0 0 12px #e9b94933}
.bd h4{margin:0;font:700 11px var(--rs);letter-spacing:.05em;color:var(--parch);display:flex;justify-content:space-between;white-space:nowrap;gap:4px}
.bd .t{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;white-space:nowrap}.bd .t span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bd .o{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;white-space:nowrap}.bd .o span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gapb{height:4px;background:#221d14;border-radius:2px;overflow:hidden;margin:2px 0 1px}.gapb i{display:block;height:100%}
.hag{display:grid;grid-template-columns:auto repeat(24,minmax(0,1fr));gap:2px;padding:2px 5px 5px;align-items:stretch}
.hag .h{font:700 11px var(--rs);color:var(--gold);letter-spacing:.08em;display:flex;align-items:center;padding-right:4px}
.hc{border-radius:3px;font:600 11px var(--ui);text-align:center;line-height:13px;padding:1px 0;color:#120e06;overflow:hidden;white-space:nowrap}
.hc small{display:block;font:500 11px var(--ui);opacity:.8}
.ps-0{background:#3a3328;color:var(--dm)}.ps-1{background:#3d6a9a}.ps-2{background:#c27c2c}.ps-3{background:#5aa64a}
/* vault */
.vtop{display:flex;align-items:baseline;gap:12px;padding:3px 9px;border-bottom:1px solid var(--ln);white-space:nowrap}
.vbig{font:800 19px var(--mono);color:var(--gold)}.vtop small{color:var(--dm);font-size:11px;margin-left:3px}
.vgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr) minmax(0,1fr);flex:1;min-height:0}
.vgrid>div{display:flex;flex-direction:column;min-height:0;padding:3px 8px;border-right:1px solid var(--ln)}.vgrid>div:last-child{border-right:0}
#flow{flex:1;min-height:0}#flow svg{display:block}
.it{display:grid;grid-template-columns:20px minmax(0,1fr) 46px 50px;gap:4px;align-items:center;line-height:20px;font-size:12px;border-bottom:1px dashed #241f15}
.hold{padding:2px 0;border-bottom:1px dashed #241f15;font-size:12px}.hold .h1{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.hold .h2{white-space:nowrap;overflow:hidden;line-height:17px}.hold .h2 .mono{font-size:11px;margin-right:3px}
.src{font:600 11px var(--ui);letter-spacing:.08em;color:var(--fa);text-transform:uppercase}
.warn{color:var(--org);font-size:11px}
/* items */
.ico{display:inline-block;background-image:url(/items.png);background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle;flex:none}
.ico.none{background:#2a2419;border:1px dashed #5a5040;border-radius:3px;color:var(--dm);font:700 11px/1 var(--ui);display:inline-flex;align-items:center;justify-content:center;font-style:normal;overflow:hidden}
.q{position:absolute;left:2px;top:0;font:700 11px/1 var(--ui);letter-spacing:-.02em;text-shadow:1px 1px 0 #000,0 0 2px #000;pointer-events:none}
.q.y{color:#ffff00}.q.w{color:#fff}.q.gr{color:#00ff80}
.pack{display:grid;grid-template-columns:repeat(4,40px);grid-auto-rows:32px;gap:1px;padding:4px;background:#3e3529;border:2px solid #2b241a;border-radius:4px;box-shadow:inset 0 0 0 1px #5a4d3a,0 0 0 1px #0008}
.cell{position:relative;display:flex;align-items:center;justify-content:center}.pack .cell:hover,.bankg .cell:hover{background:#ffffff14}
.bankg{display:grid;grid-template-columns:repeat(auto-fill,40px);grid-auto-rows:32px;gap:1px;padding:3px;background:#2e271d;border:2px solid #2b241a;border-radius:4px;max-height:104px;overflow:auto;align-content:start}
.bankg .empty{grid-column:1/-1;color:var(--dm);font-size:12px;padding:3px}
/* detail */
.d{padding:5px 9px;display:flex;flex-direction:column;gap:5px}
.dh{display:flex;align-items:center;gap:7px;white-space:nowrap}.dh h3{margin:0;font:700 20px var(--rs);color:var(--gold);letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.stat{background:var(--p2);border:1px solid var(--ln);border-radius:4px;padding:0 6px;min-width:0}
.stat span{display:block;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dm);white-space:nowrap}.stat b{font:700 12.5px var(--mono);white-space:nowrap}
.strip{display:flex;height:12px;border-radius:2px;overflow:hidden;background:#0c0a07}.strip i{flex:1;min-width:1px}
.k-x{background:var(--grn)}.k-m{background:var(--blu)}.k-a{background:var(--tea)}.k-d{background:var(--vio)}.k-s{background:var(--org)}.k-i{background:var(--red)}
.hx0{background:#15120d}.hx1{background:#4a3a14}.hx2{background:#7d5f18}.hx3{background:#b88a22}.hx4{background:#e9b949}.hx5{background:#fff1b8}
.shares{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}.shares div{font-size:11.5px;display:flex;gap:4px;align-items:center;justify-content:space-between;background:var(--p2);border-radius:3px;padding:0 5px}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.sk{background:var(--p2);border:1px solid var(--ln);border-radius:3px;padding:0 5px;font-size:11.5px;position:relative;overflow:hidden;display:flex;justify-content:space-between;line-height:16px}
.sk b{font:600 11.5px var(--mono)}.sk.mx{border-color:var(--gold2);color:var(--gold)}.sk.goal{border-color:var(--tea)}.sk i{position:absolute;left:0;bottom:0;height:2px;background:var(--gold2)}
.inv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.list{font-size:12px}.list>div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed #241f15;white-space:nowrap}
.list>div>span:first-child{overflow:hidden;text-overflow:ellipsis}
.cmb{display:grid;grid-template-columns:minmax(0,1fr) 40px 50px;gap:4px;font-size:11.5px;border-bottom:1px dashed #241f15;white-space:nowrap}
.result{font:10.5px var(--mono);color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* activity */
.scr{display:grid;grid-template-columns:minmax(0,1fr) 30px 40px 64px;gap:4px;font-size:12px;align-items:center;white-space:nowrap}
.pips{display:flex;gap:1px}.pips i{width:4px;height:9px;border-radius:1px}
.feed>div{display:grid;grid-template-columns:52px 14px 96px minmax(0,1fr);gap:5px;font-size:12px;padding:0 8px;border-bottom:1px solid #1b1710;white-space:nowrap;line-height:17px}
.feed>div span:last-child{overflow:hidden;text-overflow:ellipsis}
.secret{filter:blur(4px);user-select:none;cursor:pointer;color:var(--gold,#dfc080);letter-spacing:-1px}.secret:hover{filter:blur(3px)}.secret.shown{filter:none;user-select:text;letter-spacing:normal}
/* round 4: header hero numbers, mini strip, race, economy, role rows */
.kpi.hero b{font:700 20px var(--ui);font-variant-numeric:proportional-nums;color:var(--gold);letter-spacing:.01em}
.kpi.hero b small{font:600 13px var(--ui);color:var(--dm);margin-left:3px}
.mini{display:flex;gap:12px;font:500 11px var(--ui);color:var(--dm);white-space:nowrap;margin-left:10px}.mini b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.rhead{display:flex;align-items:center;gap:10px;padding:4px 9px;border-bottom:1px solid var(--ln);white-space:nowrap;flex-wrap:nowrap;overflow:hidden}
.gate{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--ui);color:var(--dm)}.gate i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gate.ok i{background:var(--grn)}.gate.no i{background:transparent;border:2px solid var(--red)}.gate.ok{color:var(--tx)}
.rk{font:500 13px var(--ui);color:var(--dm)}.rk b{font:700 13px var(--ui);color:var(--tx);font-variant-numeric:tabular-nums}.rk small{font-size:11px}
.race{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;padding:4px 9px 6px}
.rr{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:6px;align-items:center;height:17px;border-bottom:1px solid #1b1710}
.rr .rl{font:600 12px var(--ui);color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .rs{font:600 12px var(--ui);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rr svg{display:block;width:100%;height:12px}
.st-win{color:var(--grn)}.st-floor{color:var(--org)}.st-late{color:var(--red)}.st-none{color:var(--dm)}
.egrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.9fr);flex:1;min-height:0}
.egrid>div{display:flex;flex-direction:column;min-height:0;padding:3px 8px;border-right:1px solid var(--ln)}.egrid>div:last-child{border-right:0}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 50px 54px 74px;gap:4px;font:500 12px var(--ui);border-bottom:1px dashed #241f15;line-height:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fr span{overflow:hidden;text-overflow:ellipsis}.fr .n{text-align:right}
.sup{display:grid;grid-template-columns:18px minmax(0,1fr) 46px 52px;gap:4px;align-items:center;font:500 12px var(--ui);line-height:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gold{font:600 12px var(--ui);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.al.more{border-style:dashed;color:var(--dm)}

<body>
<div class="app">
<header>
  <div class="brand">SWARM CONTROL<small>rs-sdk demo</small></div>
  <div class="kpis">
    <div class="kpi hero" title="boards where the realistic plan beats the live #1 (floor plan in brackets)"><b id="k-win">-</b><span>boards won by plan</span></div>
    <div class="kpi hero" title="Overall board: realistic finish against the live #1, in ticks (game time in brackets)"><b id="k-gap">-</b><span>overall gap</span></div>
    <div class="kpi hero" title="go/no-go gates for the main run (the gate file in .practice)"><b id="k-gates">-</b><span>go gates</span></div>
    <div class="kpi hero" title="coins per hour of the live gold farmers, measured over the last 2 minutes"><b id="k-gold">-</b><span>gold per hour</span></div>
    <div class="kpi"><b id="k-gp">-</b><span>vault value</span></div>
    <div class="kpi"><b id="k-xp">-</b><span>swarm xp per hour</span></div>
  </div>
  <div class="mini" id="mini"></div>
  <div class="links"><span class="pulse" id="pulse" title="live, every 2 s"></span><span class="mono dm" id="clock"></span>
    <a href="https://rs-sdk-demo.fly.dev/hiscores" target="_blank">Hiscores</a><a href="https://rs-sdk-demo.fly.dev/market" target="_blank">Market</a></div>
</header>
<div class="alerts" id="alerts"></div>
<div class="grid">
  <div class="col">
    <section class="card" style="flex:0 1 auto;max-height:520px"><h2>Live accounts <em id="cnt"></em></h2><div class="scroll" id="roster"></div></section>
    <section class="card" style="height:104px;flex:none"><h2>Practice <em id="pcnt"></em></h2><div class="prac" id="prac"></div></section>
    <section class="card" style="flex:1 1 200px"><h2>Owner requests <em id="rqh"></em></h2><div class="rq" id="rq"></div></section>
    <section class="card" style="height:194px;flex:none"><h2>Machine <em id="mach-h"></em></h2><div class="mach" id="mach"></div></section>
  </div>
  <div class="col">
    <section class="card" style="flex:1"><h2>World <em id="map-h"></em><span class="tog"><button id="bt" title="fly to the next most interesting bot every 60 s">TOUR</button></span><span class="tog"><button id="b3" class="on">3D</button><button id="b2">2D</button></span></h2>
      <div class="mapwrap" id="mw"><iframe id="rsw" allow="cross-origin-isolated; fullscreen" title="rs-world 3D viewer"></iframe><canvas id="map"></canvas><div class="follow" id="follow"></div>
      <div class="legend" id="legend" style="display:none"><span><b class="on"></b>playing</span><span><b class="wd"></b>in world / local</span><span><b class="off"></b>offline</span></div></div></section>
    <section class="card" style="flex:none"><h2>Main account race <em id="race-h"></em></h2><div class="rhead" id="rhead"></div><div class="race" id="race"></div></section>
    <section class="card" style="height:262px;flex:none"><h2>Economy <em id="vsum"></em></h2><div id="vault" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></section>
  </div>
  <div class="col">
    <section class="card" style="flex:1"><h2>Account <em id="dupd"></em></h2><div class="scroll d" id="detail"></div></section>
    <section class="card" style="height:262px;flex:none"><h2>Activity <em id="acth"></em></h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:3px 8px;border-bottom:1px solid var(--ln);flex:none" id="scripts"></div>
      <div class="scroll feed" id="feed"></div></section>
  </div>
</div>
</div>
<div id="tip"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=ms=>ms==null||ms<0||!isFinite(ms)?'-':ms<60e3?`${Math.round(ms/1e3)}s`:ms<3600e3?`${Math.round(ms/6e4)}m`:ms<864e5?`${(ms/36e5).toFixed(1)}h`:`${Math.round(ms/864e5)}d`;
const dur=ms=>ms==null||ms<0?'-':ms<60e3?`${Math.round(ms/1e3)}s`:ms<3600e3?`${Math.floor(ms/6e4)}m ${String(Math.floor(ms%6e4/1e3)).padStart(2,'0')}s`:`${Math.floor(ms/36e5)}h ${String(Math.floor(ms%36e5/6e4)).padStart(2,'0')}m`;
const nf=n=>Number(n||0).toLocaleString('en-US'),gp=n=>n==null?'-':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e7?(n/1e6).toFixed(1)+'M':n>=1e5?Math.round(n/1e3)+'K':nf(Math.round(n));
const K={x:'xp',m:'move',a:'anim',d:'dialog',s:'stun',i:'idle'},KC={xp:'var(--grn)',move:'var(--blu)',anim:'var(--tea)',dialog:'var(--vio)',stun:'var(--org)',idle:'var(--red)'};
let S={bots:[],boards:[],events:[],results:[],scripts:[],alerts:[]},sel=null,picked=false,mode='3d',MAPI=null,tipFor=null,tipXY=[0,0],rswFor=null;
const STATIC=new URLSearchParams(location.search).has('static');
const PLACES=[['Lumbridge',3222,3218],['Varrock',3212,3428],['Draynor',3093,3244],['Port Sarim',3029,3217],['Falador',2965,3380],['Ardougne',2662,3305],['Brimhaven',2760,3180],['Musa Point',2920,3160],['Catherby',2810,3435],['Seers',2725,3485],['Baxtorian Falls',2521,3495],['GE',3181,3443],['Al Kharid',3293,3175],['Yanille',2590,3090],['Taverley',2895,3440],['Edgeville',3090,3490]];
const st=b=>b.reserved&&!b.inWorld?['off','reserved']:b.inWorld&&b.fresh?['on','playing']:b.inWorld?['wd','in world']:b.fresh?['wd',b.practice?'practice':'status only']:['off','offline'];
const running=b=>b.fresh||b.inWorld;
const skills=b=>(b.skills||[]).filter(k=>!/^Stat\d+$/.test(k.name));
const ledger=b=>{const l=b.ledger;if(!l)return null;const t=Object.values(l).reduce((a,c)=>a+c,0);if(!t)return null;return{t,p:Object.fromEntries(Object.values(K).map(n=>[n,100*(l[n]||0)/t]))}};
const lbar=(L,w)=>`<span class="lb" style="width:${w}">${Object.values(K).map(n=>`<i style="width:${L.p[n].toFixed(1)}%;background:${KC[n]}"></i>`).join('')}</span>`;
function svgSpark(v,w,h,col='#4fc9b2'){if(!v||v.length<2)return`<svg width="${w}" height="${h}"></svg>`;const mx=Math.max(1,...v),pts=v.map((y,i)=>`${(i/(v.length-1)*(w-2)+1).toFixed(1)},${(h-1-y/mx*(h-3)).toFixed(1)}`);
  return`<svg width="${w}" height="${h}"><polyline points="1,${h} ${pts.join(' ')} ${w-1},${h}" fill="${col}22" stroke="none"/><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.3"/></svg>`}
const when=at=>{const d=new Date(at),t=d.toLocaleTimeString('en-GB');return new Date(S.now).toDateString()===d.toDateString()?t:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+t.slice(0,5)};
const hm=at=>new Date(at).toLocaleTimeString('en-GB').slice(0,5);
const actChip=a=>a?`<span class="act" style="background:${KC[a]}">${a}</span>`:'';
const ocIcon=o=>o==='ok'?'<span class="oc ok" title="last run ok">✔</span>':o==='died'?'<span class="oc died" title="last run: died">✝</span>':o==='fail'?'<span class="oc fail" title="last run failed">✘</span>':'<span class="oc fa">·</span>';
function jobPill(j){if(!j)return'';const c=/^ended/.test(j.state)?'ended':/^external/.test(j.state)?'external':/^waiting/.test(j.state)?'waiting':j.state;return`<span class="job ${E(c)}" title="${E(j.state)} · ${E(j.goal)}${j.note?' · '+E(j.note):''}">${E(j.state.replace(/\s*\(.*\)$/,''))}</span>`}
function icon(name,sz=32){const id=S.icons?.[name];if(id==null||id>=3904)return`<i class="ico none" style="width:${sz}px;height:${sz}px;font-size:${Math.max(9,sz*.32)}px" title="${E(name)} (no sprite in the local sheet)">${E(String(name).split(/\s+/).map(w=>w[0]).join('').slice(0,3))}</i>`;const k=sz/32;
  return`<i class="ico" style="width:${sz}px;height:${sz}px;background-size:${2048*k}px auto;background-position:-${(id%64)*sz}px -${Math.floor(id/64)*sz}px" title="${E(name)}"></i>`}
// Stack numbers as the game draws them: yellow below 100K, white K up to 10M, green M above.
const qty=n=>n<1e5?['y',String(n)]:n<1e7?['w',Math.floor(n/1e3)+'K']:['gr',Math.floor(n/1e6)+'M'];
function cell(it){if(!it)return'<div class="cell"></div>';const[c,t]=qty(it.count);return`<div class="cell" title="${E(it.name)} × ${nf(it.count)}">${icon(it.name)}${it.count>1?`<span class="q ${c}">${t}</span>`:''}</div>`}
function goalOf(b){return b.goalSkill?skills(b).find(k=>k.name===b.goalSkill):null}
function paceTxt(b){if(b.xpLeft===0)return`<span class="pace up" title="${b.pace?'finished: '+(b.pace.ahead?'ahead of':'behind')+' #1 '+E(b.pace.top)+' by '+E(b.pace.gap):'target reached'}">✔ done</span>`;if(!b.pace)return b.eta?`<span class="pace dm">ETA ${E(b.eta)}</span>`:'';return`<span class="pace ${b.pace.ahead?'up':'dn'}" title="projected ${E(b.finish)} vs #1 ${E(b.pace.top)} ${E(b.pace.topTime)}">${b.pace.ahead?'▲':'▼'}${E(b.pace.gap)}</span>`}

// ---- DOM diff: a container's HTML is rebuilt only when its string changes; keyed lists patch row by row ----
function put(el,html){if(typeof el==='string')el=$(el);if(el._h!==html){el._h=html;el.innerHTML=html}}
// Main account name: the server sends a marker instead of it. Draw each marker as a blurred block with no name inside;
// a click fetches the name for this tab only (a reload hides it again), so a screenshot never shows it by accident.
const MARK='⟦MAIN⟧';let REVEAL=null;
function secretSpan(){const s=document.createElement('span');s.className='secret'+(REVEAL?' shown':'');s.textContent=REVEAL||'██████';s.title=REVEAL?'main account':'click to reveal name';return s}
function hideSecrets(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes(MARK)?1:3});const hits=[];while(w.nextNode())hits.push(w.currentNode);
  for(const t of hits){const parts=t.nodeValue.split(MARK);const f=document.createDocumentFragment();parts.forEach((p,i)=>{if(i)f.appendChild(secretSpan());if(p)f.appendChild(document.createTextNode(p))});t.replaceWith(f)}
  for(const el of root.querySelectorAll('*'))for(const a of el.attributes)if(/^(title|alt|aria-label|placeholder)$/.test(a.name)&&a.value.includes(MARK))a.value=a.value.split(MARK).join(REVEAL||'main account');
}
document.addEventListener('click',async e=>{const s=e.target.closest&&e.target.closest('.secret');if(!s||REVEAL)return;e.stopPropagation();e.preventDefault();
  REVEAL=await (await fetch('/api/reveal',{cache:'no-store'})).text();for(const x of document.querySelectorAll('.secret')){x.textContent=REVEAL;x.classList.add('shown');x.title='main account'}},true);
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===3&&n.nodeValue.includes(MARK))hideSecrets(n.parentNode);else if(n.nodeType===1)hideSecrets(n)}}).observe(document.documentElement,{childList:true,subtree:true,characterData:false});
function keyed(el,rows){const have=new Map([...el.children].map(c=>[c.dataset.k,c]));let prev=null;
  for(const[k,html]of rows){let c=have.get(k);if(c)have.delete(k);else{c=document.createElement('div');c.dataset.k=k}
    if(c._h!==html){c._h=html;c.innerHTML=html;c.firstElementChild&&(c.className=c.firstElementChild.dataset.c||'')}
    const want=prev?prev.nextSibling:el.firstChild;if(c!==want)el.insertBefore(c,want);prev=c}
  for(const c of have.values())c.remove()}

function rowLive(b){const[c,t]=st(b),sk=goalOf(b),L=running(b)?ledger(b):null,idle=L?L.p.idle:null,bad=idle!=null&&idle>10;
  const role=b.reserved?'main · reserved':b.role||'?',pc=b.reserved?'res':b.roleInferred?'inf':b.name===S.vault?.banker?'bk':'';
  const tgt=b.goalLevel||99,pct=sk?Math.min(100,(sk.level-1)/Math.max(1,tgt-1)*100):0;
  return`<i hidden data-c="bot ${sel===b.name?'sel':''} ${bad?'idle':''}"></i>
  <div class="l"><span class="dot ${c}" title="${t}"></span><span class="nm">${E(b.name)}</span><span class="pill ${pc}" ${b.roleInferred?'title="inferred from the highest non-Hitpoints skill"':''}>${E(role)}</span>${jobPill(b.job)}${IR[b.name]?.why?`<span class="why" title="interest score ${IR[b.name].score.toFixed(0)}: ${E(IR[b.name].all)}">${E(IR[b.name].why)}</span>`:''}</div>
  <div class="r">${actChip(b.action)}<span class="mono dm" title="status file age">${b.at?ago(S.now-b.at):''}</span></div>
  <div class="l">${roleLine(b)??''}${!roleLine(b)&&sk?`<span class="gbar"><i style="width:${pct.toFixed(1)}%"></i><span>${E(b.goalSkill)} ${sk.level} / ${tgt}</span></span>${paceTxt(b)}${b.role4?.kind==='fish'?`<span class="dm" title="feathers in the pack">${nf(b.role4.feathers)} feathers</span>`:''}${b.role4?.kind==='wood'&&b.hp?`<span class="${b.hp.now<=b.hp.max/3?'dn':'dm'}">HP ${b.hp.now}/${b.hp.max}</span>`:''}`:(roleLine(b)?'':`<span class="dm ell">${E(b.job?.goal||b.goal||'')}</span>`)}</div>
  <div class="r">${b.role4?.kind==='gold'?(b.role4.coinsPerTick!=null?`<span class="mono gold">${gp(b.role4.coinsPerTick*9000)} gp/h</span>`:''):b.xpPerHour!=null?`<span class="mono">${gp(b.xpPerHour)} xp/h</span>`:''}${b.spark?.length>1?svgSpark(b.spark,52,14):''}</div>
  <div class="l"><span class="ell" title="${E(b.phase||'')}">${/^\s*\w+=\S+(\s+\w+=\S+){2,}/.test(b.phaseShort||'')?'':E(b.phaseShort||'')}</span>${b.phaseSince?`<span class="since">${b.phaseExact?'':'≥'}${dur(S.now-b.phaseSince)}</span>`:''}</div>
  <div class="r">${L?`${lbar(L,'70px')}<span class="idl ${bad?'bad':'ok'}">idle ${idle.toFixed(0)}%</span>`:''}</div>`}
function rowOff(b){const role=b.reserved?'main · reserved':b.role||'?',pc=b.reserved?'res':b.roleInferred?'inf':b.name===S.vault?.banker?'bk':'';
  const why=b.job?.note||(b.reserved?'reserved for the main run':b.at?'':'no status file yet');
  return`<i hidden data-c="off1 ${sel===b.name?'sel':''}"></i>${ocIcon(b.outcome)}<span class="nm">${E(b.name)}</span><span class="pill ${pc}">${E(role)}</span>${jobPill(b.job)}<span class="note" title="${E(why)}${b.result?' · last RESULT: '+E(b.result):''}">${E(why)}</span><span class="mono fa" title="last seen">${b.lastSeen?ago(S.now-b.lastSeen):'never'}</span>`}
function roster(){const live=S.bots.filter(b=>!b.practice),on=ranked(),off=live.filter(b=>!(running(b)&&!b.reserved));
  const rows=[...on.map(b=>['L'+b.name,rowLive(b)])];
  if(off.length)rows.push(['G-off',`<i hidden data-c="grp"></i>offline · ${off.length} · reason from the swarm plan`]);
  rows.push(...off.map(b=>['O'+b.name,rowOff(b)]));
  keyed($('#roster'),rows);
  const pr=S.bots.filter(b=>b.practice),pRun=pr.filter(running),pDone=pr.filter(b=>!running(b)).sort((a,b)=>(b.at||0)-(a.at||0)),oc=k=>pDone.filter(b=>b.outcome===k).length;
  // 3 rows of 4: running bots first, then the newest finished; older ones are only counted.
  const shown=[...pRun,...pDone].slice(0,12),rest=pr.length-shown.length;
  $('#pcnt').textContent=`${pRun.length} running · ${pDone.length} done (✔${oc('ok')} ✘${oc('fail')} ✝${oc('died')}) · last 30 min${rest>0?' · +'+rest+' not shown':''}`;
  keyed($('#prac'),shown.map(b=>{const sk=goalOf(b),tgt=b.goalLevel||99,pct=sk?Math.min(100,(sk.level-1)/Math.max(1,tgt-1)*100):0,[c]=st(b);
    return['P'+b.name,`<i hidden data-c="pc ${sel===b.name?'sel':''}"></i><span class="dot ${c}"></span>${running(b)?'':ocIcon(b.outcome)}<span class="ell" style="flex:none;max-width:62px" title="${E(b.name)} · ${E(b.phase||'')}${b.result?' · '+E(b.result):''}">${E(b.name)}</span><span class="gb" title="${sk?E(b.goalSkill)+' '+sk.level+'/'+tgt:''}"><i style="width:${pct.toFixed(0)}%"></i></span>`]}));
  $('#cnt').textContent=`${on.length} running · ${off.length} offline`}
// Interest score: what is worth watching now. Recent death or alert, a new phase (level-up or milestone),
// close to or ahead of a board #1, a high XP rate; idle sinks. The order is kept for 30 s (or until a new alert)
// so rows do not jump every 2 s; the reason shows as a tag on the row.
let IR={},ORDER=[],ORDER_AT=0,ORDER_ALERT=0;
function interest(b){const r=[];let s=0;const now=S.now,al=(S.alerts||[]).filter(a=>a.name===b.name&&!a.practice&&now-a.at<15*60e3);
  if(al.some(a=>a.kind==='death')){s+=100;r.push('died')}else if(al.length){s+=60;r.push(al[0].kind)}
  if(b.phaseSince&&b.phaseExact&&now-b.phaseSince<3*60e3){s+=40;r.push('new: '+String(b.phaseShort||'').slice(0,18))}
  if(b.pace&&b.xpLeft>0){if(b.pace.ahead){s+=70;r.push('ahead of #1')}else{s+=25;r.push('chasing #1')}}
  const cpt=b.role4?.kind==='gold'?b.role4.coinsPerTick:null;if(cpt>0){s+=Math.min(30,cpt*2);if(!r.length)r.push(cpt.toFixed(1)+' c/tick')}else if(b.role4?.kind!=='gold'&&b.xpPerHour>0){s+=Math.min(30,b.xpPerHour/2e5);if(!r.length)r.push(gp(b.xpPerHour)+' xp/h')}
  if(b.action==='idle'){s-=20;r.push('idle')}
  return{score:s,why:r[0]||'',all:r.join(' · ')||'nothing special'}}
function ranked(){const on=S.bots.filter(b=>!b.practice&&running(b)&&!b.reserved);IR={};for(const b of on)IR[b.name]=interest(b);
  const lastAlert=Math.max(0,...(S.alerts||[]).filter(a=>!a.practice).map(a=>a.at));
  if(S.now-ORDER_AT>30e3||lastAlert>ORDER_ALERT||on.some(b=>!ORDER.includes(b.name))){ORDER=[...on].sort((a,b)=>IR[b.name].score-IR[a.name].score||a.name.localeCompare(b.name)).map(b=>b.name);ORDER_AT=S.now;ORDER_ALERT=lastAlert}
  return ORDER.map(n=>on.find(b=>b.name===n)).filter(Boolean)}
// Tour: when on, fly to the next most interesting bot every 60 s (?tourEvery=N seconds for testing).
const Q=new URLSearchParams(location.search);let TOUR=Q.has('tour'),TOUR_AT=0;const TOUR_MS=(Number(Q.get('tourEvery'))||60)*1e3;
function tourStep(){if(!TOUR||S.now-TOUR_AT<TOUR_MS)return;TOUR_AT=S.now;const l=ranked();if(!l.length)return;const i=l.findIndex(b=>b.name===sel);sel=l[(i+1)%l.length].name}
// The viewer reports follow-change timings; keep them on the server for the Machine panel and measurements.
window.addEventListener('message',e=>{if(e.origin!=='http://localhost:3000'||!e.data?.viewerTiming)return;fetch('/api/viewer-timing',{method:'POST',body:JSON.stringify(e.data.viewerTiming)}).catch(()=>{})});
function pick(n){if(!n)return;sel=n;picked=true;render()}
for(const id of['#roster','#prac']){const el=$(id);el.onclick=e=>{const r=e.target.closest('[data-k]');if(r&&!r.dataset.k.startsWith('G'))pick(r.dataset.k.slice(1))};
  el.onmousemove=e=>{const r=e.target.closest('[data-k]');tipFor=r&&!r.dataset.k.startsWith('G')?r.dataset.k.slice(1):null;tipXY=[e.clientX,e.clientY];tip()};el.onmouseleave=()=>{tipFor=null;tip()}}
function tip(){const el=$('#tip'),b=tipFor&&S.bots.find(q=>q.name===tipFor);if(!b){el.style.display='none';return}const L=running(b)?ledger(b):null;
  el.innerHTML=`<div class="sub"><span>${E(b.name)}</span><span>${b.job?E(b.job.state):''}</span></div>${b.job?.note?`<div class="dm" style="margin-bottom:3px">${E(b.job.note)}</div>`:''}`+(L?`<table>${Object.values(K).map(n=>`<tr><td><span class="dot" style="background:${KC[n]}"></span> ${n}</td><td style="text-align:right">${nf(b.ledger[n])}</td><td style="text-align:right;${n==='idle'&&L.p.idle>10?'color:var(--red);font-weight:700':''}">${L.p[n].toFixed(1)}%</td></tr>`).join('')}</table>${L.p.idle>10?'<div class="w">idle over 10%: standing still is a warcrime</div>':''}`:b.result?`<div class="mono dm" style="white-space:normal;font-size:11px">${E(b.result)}</div>`:'');
  el.style.display='block';const[px,py]=tipXY;el.style.left=Math.min(innerWidth-el.offsetWidth-8,px+14)+'px';el.style.top=Math.min(innerHeight-el.offsetHeight-8,py+10)+'px'}

$('#alerts').onclick=e=>{const a=e.target.closest('.al');if(a)pick(a.dataset.n)};

function flowSvg(v,W,H){const fl=v.flow||[];if(!fl.length)return`<div class="dm" style="padding:6px">No transfers yet. The banker script writes .practice/vault-log.jsonl.</div>`;
  const bk=v.banker,val=l=>Math.max(1,l.value),lefts=[],rights=[];
  for(const l of fl){if(l.to===bk||l.from!==bk){if(!lefts.includes(l.from))lefts.push(l.from)}if(l.from===bk||l.to!==bk){if(!rights.includes(l.to))rights.push(l.to)}}
  const tot=Math.max(...[fl.filter(l=>l.to===bk).reduce((n,l)=>n+val(l),0),fl.filter(l=>l.from===bk).reduce((n,l)=>n+val(l),0),1]);
  const pad=4,usable=H-30,k=(usable-pad*Math.max(lefts.length,rights.length))/tot,X0=118,X1=W/2-5,X2=W/2+5,X3=W-118;
  const place=(names,dir)=>{let y=24;const m={};for(const n of names){const h=Math.max(3,fl.filter(l=>(dir==='L'?l.from:l.to)===n).reduce((s,l)=>s+val(l)*k,0));m[n]={y,h,o:0};y+=h+pad}return m};
  const L=place(lefts,'L'),R=place(rights,'R'),bin=fl.filter(l=>l.to===bk).reduce((n,l)=>n+val(l)*k,0),bout=fl.filter(l=>l.from===bk).reduce((n,l)=>n+val(l)*k,0),bh=Math.max(bin,bout,6),by=24,bo={i:0,o:0};
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#e9b949" stop-opacity=".55"/><stop offset="1" stop-color="#e9b949" stop-opacity=".25"/></linearGradient><linearGradient id="fg2" x1="0" x2="1"><stop offset="0" stop-color="#4fc9b2" stop-opacity=".3"/><stop offset="1" stop-color="#4fc9b2" stop-opacity=".6"/></linearGradient></defs>`;
  const band=(x0,y0,x1,y1,h,g,title)=>`<path d="M${x0},${y0} C${(x0+x1)/2},${y0} ${(x0+x1)/2},${y1} ${x1},${y1} L${x1},${y1+h} C${(x0+x1)/2},${y1+h} ${(x0+x1)/2},${y0+h} ${x0},${y0+h} Z" fill="url(#${g})"><title>${E(title)}</title></path>`;
  for(const l of fl){const h=Math.max(1.5,val(l)*k),tt=`${l.from} → ${l.to}: ${nf(l.coins)} coins, ${l.items.length} kinds, ${gp(l.value)} gp, ${l.n} trade${l.n>1?'s':''}, last ${when(l.last)}`;
    if(l.to===bk&&L[l.from]){const a=L[l.from];s+=band(X0,a.y+a.o,X1,by+bo.i,h,'fg',tt);a.o+=h;bo.i+=h}
    else if(l.from===bk&&R[l.to]){const a=R[l.to];s+=band(X2,by+bo.o,X3,a.y+a.o,h,'fg2',tt);a.o+=h;bo.o+=h}
    else if(L[l.from]&&R[l.to]){const a=L[l.from],b2=R[l.to];s+=band(X0,a.y+a.o,X3,b2.y+b2.o,h,'fg2',tt);a.o+=h;b2.o+=h}}
  for(const n of lefts){const a=L[n],g=fl.filter(l=>l.from===n).reduce((x,l)=>x+l.value,0);s+=`<rect x="${X0-4}" y="${a.y}" width="4" height="${a.h}" fill="#e9b949"/><text x="${X0-8}" y="${a.y+a.h/2+4}" text-anchor="end" fill="#ece2c6" font-size="11.5" font-family="Barlow Semi Condensed">${E(n)} <tspan fill="#9a8c6e">${gp(g)}</tspan></text>`}
  for(const n of rights){const a=R[n],g=fl.filter(l=>l.to===n).reduce((x,l)=>x+l.value,0);s+=`<rect x="${X3}" y="${a.y}" width="4" height="${a.h}" fill="#4fc9b2"/><text x="${X3+8}" y="${a.y+a.h/2+4}" fill="#ece2c6" font-size="11.5" font-family="Barlow Semi Condensed">${E(n)} <tspan fill="#9a8c6e">${gp(g)}</tspan></text>`}
  const hb=v.holders.find(h=>h.banker);
  s+=`<rect x="${X1}" y="${by}" width="${X2-X1}" height="${bh}" rx="2" fill="#b590f2"/><text x="${W/2}" y="13" text-anchor="middle" fill="#b590f2" font-size="12" font-weight="700" font-family="Barlow Semi Condensed">${E(bk)} holds ${gp(hb?.value||0)}</text></svg>`;
  return s}

function drawMap(){if(mode!=='2d')return;const c=$('#map'),w=c.clientWidth,h=c.clientHeight;if(!w)return;if(c.width!==w||c.height!==h){c.width=w;c.height=h}const g=c.getContext('2d'),m=S.map||{x0:2368,z0:2880,w:560,h:416,scale:2};

  g.font='11px "Barlow Semi Condensed",sans-serif';for(const[n,x,z]of PLACES){g.fillStyle='#9a8c6e';g.fillRect(X(x)-1.5,Z(z)-1.5,3,3);g.fillText(n,X(x)+5,Z(z)+3)}

  if(mode!=='3d')return;
  const f=$('#rsw');
  if(!f.src){rswFor=sel;f.src=`http://localhost:3000/?live=wss://rs-sdk-demo.fly.dev/worldfeed${Q.get('flight')==='0'?'&flight=0':''}${Q.get('cache')==='0'?'&cache=0':''}&embed=1&fps=20&scale=0.75&hideNamesFrom=${encodeURIComponent(location.origin+'/api/hidden-names')}&highlightFrom=${encodeURIComponent(location.origin+'/api/our-names')}${sel?'&follow='+encodeURIComponent(sel):''}`}
  else if(rswFor!==sel&&sel){rswFor=sel;f.contentWindow?.postMessage({follow:sel},'http://localhost:3000')}}

// ---- round 4: header, alerts, main race, economy ----
const TICK_MS=400,tickTime=t=>t==null?'-':dur(Math.abs(t)*TICK_MS);
function header(){const R=S.race,G=S.gates?.gates||[],E2=S.economy,w=S.world||{},sw=S.swarm,bots=S.bots,live=bots.filter(b=>!b.practice);
  $('#k-win').innerHTML=R&&!R.error?`${R.wins}<small>/ 24 · floor ${R.floorWins}</small>`:'-';
  $('#k-gap').innerHTML=R&&R.gap!=null?`<span class="${R.gap>=0?'up':'dn'}">${R.gap>0?'+':''}${nf(R.gap)}</span><small>ticks · ${tickTime(R.gap)}</small>`:'-';
  $('#k-gates').innerHTML=G.length?`${G.filter(g=>g.pass).length}<small>/ ${G.length}</small>`:'-';
  $('#k-gold').textContent=E2?gp(E2.goldPerTick*3600e3/TICK_MS):'-';
  $('#k-xp').textContent=gp(live.reduce((n,b)=>n+(b.fresh&&b.xpPerHour>0?b.xpPerHour:0),0));
  put('#mini',`<span><b>${bots.filter(b=>b.inWorld).length}</b> in world</span><span><b>${sw?sw.running+' / '+sw.maxBots:'-'}</b> swarm</span><span><b>${live.length}</b> accounts</span><span><b>${nf(S.worldPlayers)}</b> players</span><span>tick <b>${w.tick!=null?nf(w.tick):'-'}</b></span><span>cpu <b>${S.sys?.cpu!=null?S.sys.cpu.toFixed(0)+'%':'-'}</b></span>`)}

// Alerts: the last 60 minutes plus the unresolved ones (stuck, idle now); older ones fold into "N earlier".
// Practice alerts only as a muted count.
function alertsBar(){const now=S.now,all=S.alerts||[],live=all.filter(a=>!a.practice),prac=all.filter(a=>a.practice);
  const recent=live.filter(a=>now-a.at<60*60e3||a.kind==='stuck'||a.kind==='idle'),older=live.filter(a=>!recent.includes(a));
  const chip=x=>`<span class="al ${x.kind}" data-n="${E(x.name)}" title="${E(when(x.at))} · ${E(x.text)}"><span class="t">${x.kind.toUpperCase()}</span><b>${E(x.name)}</b><span class="dm ell" style="max-width:240px">${E(x.text)}</span><span class="fa">${hm(x.at)}</span></span>`;
  const list=l=>E(l.map(x=>hm(x.at)+' '+x.kind+' '+x.name+': '+x.text).join('\n'));
  put('#alerts',`<span class="lbl">ALERTS</span>`+(recent.length?recent.map(chip).join(''):'<span class="allclear">no live alert in the last hour</span>')+
    (older.length?`<span class="al more" title="${list(older)}">${older.length} earlier</span>`:'')+(prac.length?`<span class="al more" title="${list(prac)}">practice ${prac.length}</span>`:''))}

// Main account race: for each board, the realistic plan's finish (bar), the floor plan's finish (tick) and the
// live #1's time (gold line), all in ticks from the start of the run.
function raceView(){const R=S.race,G=S.gates?.gates||[];
  if(!R||R.error){put('#rhead','');put('#race',`<span class="dm">Plan not available: ${E(R?.error||'no research/hiscores-live.json')}</span>`);return}
  $('#race-h').textContent=`plan vs live #1 · ${R.source} · bar realistic, tick floor, gold line #1 · ticks of 0.4 s`;
  const gh=(S.gapHistory||[]).filter(v=>v!=null),mn=Math.min(0,...gh);
  put('#rhead',G.map(g=>`<span class="gate ${g.pass?'ok':'no'}" title="${E(g.detail)}"><i></i>${E(g.name)}</span>`).join('')+
    `<span class="rk" style="margin-left:auto">won <b>${R.wins}</b> / 24 <small>(floor ${R.floorWins})</small></span>`+
    `<span class="rk" title="Overall board: realistic finish against #1">overall <b class="${R.gap>=0?'up':'dn'}">${R.gap>0?'+':''}${nf(R.gap)}</b> <small>${tickTime(R.gap)}</small></span>`+
    `<span class="rk" title="planner inputs that are ESTIMATE or CODE-READ, not MEASURED">${R.unmeasured} <small>unmeasured</small></span>`+
    (gh.length>1?`<span class="rk" title="overall gap over time (${gh.length} changes)">${svgSpark(gh.map(v=>v-mn),70,16,'#e9b949')}</span>`:''));
  put('#race',R.rows.map(r=>{const re=r.real,fl=r.floor,dl=r.deadline;
    const cls=re.status==='WIN'?'st-win':fl.status==='WIN'?'st-floor':re.status==='LATE'||fl.status==='LATE'?'st-late':'st-none';
    const ic=re.status==='WIN'?'✔':fl.status==='WIN'?'◐':re.status==='LATE'?'✘':'·';
    const best=(S.boards||[]).find(b=>b.board===r.label||(r.id==='runite'&&b.board==='Runite'))?.best;
    const tip=`${r.label}: #1 ${r.holder||'?'}${dl!=null?' at '+nf(dl)+' ticks ('+tickTime(dl)+')':''} · realistic ${re.finish!=null?nf(re.finish):'never'} (${re.status}) · floor ${fl.finish!=null?nf(fl.finish):'never'} (${fl.status})${best?' · our best now: '+best.name+' #'+nf(best.rank):''}`;
    let bar,slack;
    if(dl==null||re.status==='NO-CLOCK'){const mx=Math.max(re.finish||1,fl.finish||1)*1.04,x=t=>(t/mx*300).toFixed(1);
      bar=`<rect width="300" height="12" fill="#1d1912"/>${re.finish!=null?`<rect y="3" width="${x(re.finish)}" height="6" fill="#5a5040"/>`:''}${fl.finish!=null?`<rect x="${x(fl.finish)-1}" y="1" width="2" height="10" fill="#d9c48f"/>`:''}`;
      slack=re.status==='NEVER'?'never':'no clock'}
    else{const mx=Math.max(dl,re.finish||0,fl.finish||0)*1.04,x=t=>(Math.min(t,mx)/mx*300).toFixed(1),col=re.status==='WIN'?'#7ed36a':'#ec5a40';
      bar=`<rect width="300" height="12" fill="#1d1912"/><rect width="${x(dl)}" height="12" fill="#e9b94922"/>${re.finish!=null?`<rect y="3" width="${x(re.finish)}" height="6" fill="${col}"/>`:''}${fl.finish!=null?`<rect x="${x(fl.finish)-1}" y="1" width="2" height="10" fill="#d9c48f"/>`:''}<rect x="${x(dl)-0.75}" width="1.5" height="12" fill="#e9b949"/>`;
      slack=re.slack!=null?`${re.slack>0?'+':''}${nf(re.slack)}`:'never'}
    return`<div class="rr" title="${E(tip)}"><span class="rl">${E(r.label)}</span><svg viewBox="0 0 300 12" preserveAspectRatio="none">${bar}</svg><span class="rs ${cls}">${ic} ${slack}</span></div>`}).join(''))}

// Economy: the vault flow, gold farmers (coins per tick, made this run, food and time to empty) with the GE stock
// of the main run's key supplies, items held, and who holds them.
function economy(){const v=S.vault,X=S.economy;if(!v||!X)return;const live=v.holders.length,seen=v.holders.filter(h=>h.bankSeen).length;
  $('#vsum').textContent=`${live} holders · banks known ${seen}/${live} · banker ${v.banker} (vault-log) · GE quotes ${X.pricesAt?ago(S.now-X.pricesAt)+' old':'loading'}`;$('#k-gp').textContent=gp(v.value);
  if(!$('#eg')){$('#vault').innerHTML=`<div class="vtop" id="vt"></div><div class="egrid" id="eg"><div><div class="sub"><span>Flow</span><span>givers → banker → receivers</span></div><div id="flow"></div></div><div><div class="sub"><span>Gold farmers</span><span>c/tick · made · food left</span></div><div id="farm"></div><div class="sub" style="margin-top:4px"><span>GE stock · key supplies</span><span id="suph"></span></div><div class="scroll" id="sup"></div></div><div><div class="sub"><span>Items</span><span>count · value</span></div><div class="scroll" id="vit"></div></div><div><div class="sub"><span>Who holds what</span><span>age</span></div><div class="scroll" id="vho"></div></div></div>`}
  const tr=X.trend||[],tmin=Math.min(...tr,0);
  put('#vt',`<span><span class="vbig">${gp(v.value)}</span><small>est. value</small></span>${tr.length>1?`<span title="vault value, one point a minute">${svgSpark(tr.map(t=>t-tmin),80,18,'#e9b949')}</span>`:''}<span>${icon('Coins',16)}<b class="g">${nf(v.coins)}</b><small>coins</small></span><span><b class="gold">${gp(X.goldPerTick*3600e3/TICK_MS)}</b><small>gold per hour (${X.goldPerTick.toFixed(1)} c/tick)</small></span><span><b>${v.items.length}</b><small>kinds</small></span>${seen<live?`<span class="warn" style="margin-left:auto">${live-seen} bank${live-seen>1?'s':''} never opened</span>`:''}`);
  put('#farm',X.farmers.length?X.farmers.map(f=>{const low=f.emptyMs!=null&&f.emptyMs<30*60e3;
    return`<div class="fr" title="${E(f.name)}: ${nf(f.coins)} coins held · food ${f.food} in pack, ${f.bankFood} in bank${f.eatPerTick?' · eats '+(f.eatPerTick*9000).toFixed(0)+' an hour':''}"><span><b>${E(f.name)}</b></span><span class="n">${f.coinsPerTick!=null?f.coinsPerTick.toFixed(1):'–'}</span><span class="n">${f.made!=null?gp(f.made):'–'}</span><span class="n ${low?'dn':''}">${f.food}${f.emptyMs!=null?' · '+dur(f.emptyMs):''}${low?' ⚠':''}</span></div>`}).join(''):'<span class="dm">No gold farmer running.</span>');
  const sup=(X.supplies||[]),inStock=sup.filter(s=>s.stock>0).sort((a,b)=>b.stock-a.stock);
  $('#suph').textContent=`${inStock.length} of ${sup.length} in stock`;
  put('#sup',inStock.map(s=>`<div class="sup" title="${E(s.name)} · ${nf(s.stock)} for sale${s.ask!=null?' · ask '+nf(s.ask):''}${s.vwap!=null?' · 7-day avg '+nf(Math.round(s.vwap)):''}">${icon(s.name,16)}<span class="ell">${E(s.name)}</span><span class="n" style="text-align:right">${gp(s.stock)}</span><span class="dm" style="text-align:right">${s.ask!=null?gp(s.ask):'–'}</span></div>`).join('')||'<span class="dm">None of the key supplies is for sale.</span>');
  const items=v.items.map(i=>`<div class="it" title="${E(i.holders.map(h=>h.name+' '+nf(h.count)).join(', '))}${i.price!=null?' · '+nf(Math.round(i.price))+' gp each':' · no price'}">${icon(i.name,20)}<span class="ell">${E(i.name)}</span><span style="text-align:right">${gp(i.count)}</span><span class="${i.value?'g':'fa'}" style="text-align:right">${i.value!=null?gp(i.value):'?'}</span></div>`).join('')||'<span class="dm">Nothing held.</span>';
  const hold=v.holders.map(h=>`<div class="hold" title="${E(h.items.map(i=>i.name+' '+nf(i.count)).join(', '))}"><div class="h1"><b style="${h.banker?'color:var(--vio)':''}">${E(h.name)}</b><span class="g">${gp(h.value)}</span><span class="src">${h.source==='log'?'from log':h.source==='snapshot+log'?'snap + log':h.bankSeen?'snapshot':'pack only'}</span><span class="fa" style="margin-left:auto">${h.age!=null?ago(h.age):''}</span></div></div>`).join('');
  put('#flow',flowSvg(v,$('#flow').clientWidth||280,$('#flow').clientHeight||150));put('#vit',items);put('#vho',hold)}

// Role-aware second line of a running row, picked from the swarm job's goal.
function roleLine(b){const r=b.role4;if(!r)return null;
  if(r.kind==='gold'){const low=r.emptyMs!=null&&r.emptyMs<30*60e3;
    return`<span class="gold">${icon('Coins',14)} ${r.coinsPerTick!=null?r.coinsPerTick.toFixed(1)+' c/tick':'– c/tick'} · made ${r.made!=null?gp(r.made):'–'}</span><span class="${low?'dn':'dm'}" title="food in pack at the measured eat rate">food ${r.food}${r.emptyMs!=null?' · '+dur(r.emptyMs):''}${low?' ⚠':''}</span>`}
  if(r.kind==='bank')return`<span class="gold">${icon('Coins',14)} vault ${gp(S.vault?.value||0)}</span>`;
  return null}

function render(){
  const bots=S.bots,w=S.world||{},sw=S.swarm,live=bots.filter(b=>!b.practice);
  header();
  $('#clock').textContent=new Date(S.now).toLocaleTimeString('en-GB');$('#pulse').className='pulse'+(w.connected===false?' off':'');
  const first=ranked()[0]||live.find(b=>b.inWorld&&!b.reserved)||live.find(b=>b.fresh&&!b.reserved)||live.find(b=>!b.reserved)||bots[0];
  if((!sel||!bots.some(b=>b.name===sel))&&first)sel=first.name;tourStep();
  alertsBar();roster();raceView();detail();economy();activity();requests();machine();syncWorld();loadMap();drawMap();if(tipFor)tip();
}
window.addEventListener('resize',()=>{drawMap();if($('#flow'))$('#flow')._h=null;economy()});
// Errors show in the header instead of failing silently.
window.onerror=(m,src,l)=>{const c=$('#clock');c.textContent='JS error: '+m+' @'+l;c.style.color='var(--red)'};
// Static mode (screenshots) renders twice so the second, diffing render is exercised too.
if(STATIC)fetch('/api/state').then(r=>r.json()).then(j=>{S=j;render();setTimeout(()=>fetch('/api/state').then(r=>r.json()).then(k=>{S=k;render()}),2500);if(TOUR)setInterval(()=>fetch('/api/state').then(r=>r.json()).then(k=>{S=k;render()}),2000)});
else{let PV=null;const es=new EventSource('/events');es.onmessage=e=>{S=JSON.parse(e.data);if(PV===null)PV=S.pageVersion;else if(S.pageVersion&&S.pageVersion!==PV){location.reload();return}render()}}
if(new URLSearchParams(location.search).get('map')==='2d')setMode('2d');
</script>
</body>
</html>
