name: CI
# The local gate proves a change: `bun tools/ci-gate.ts --post` runs the check steps below on the PC and posts the
# `local-gate` status on HEAD. This hosted workflow uses standard runners, which cost no minutes on a public
# repository. Dispatch it through the Actions tab or `gh workflow run CI --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      native_practice:
        description: Run the quest and fleet trade practice proofs
        type: boolean
        required: false
        default: false
      native_quest:
        description: Include the complete quest delivery in native practice
        type: boolean
        required: false
        default: true
      preparation_practice:
        description: Run shared preparation cases and the AIO smoke set
        type: boolean
        required: false
        default: false
      pvp_practice:
        description: Run the complete PvP practice sweep and AIO smoke set
        type: boolean
        required: false
        default: false
      bench_pattern:
        description: Bench case patterns separated by spaces; each pattern runs on its own runner (empty runs none)
        type: string
        required: false
        default: ''
      bench_seeds:
        description: Seeds separated by commas; each seed of each pattern runs on its own runner (empty is seed 7)
        type: string
        required: false
        default: ''
      bench_args:
        description: Extra bench arguments (--profile, --no-keep, --set KEY=value, --all, --smoke, --wall-clock)
        type: string
        required: false
        default: ''
      bench_ref:
        description: Branch, tag or commit that the bench runners check out (empty is the ref of this run)
        type: string
        required: false
        default: ''
      measure_script:
        description: A script of scripts/measure/ to run alone on one clean runner, for numbers that the PC cannot give beside live bots (empty runs none)
        type: string
        required: false
        default: ''
      measure_args:
        description: Arguments of the measure script
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  pvp-practice:
    if: inputs.pvp_practice
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Prepare the pinned practice dependencies
        run: bun tools/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Each file is bound to
      # the data named in the key and is checked on read. Without them each route search measures every leg again.
      - name: Restore the route caches
        uses: actions/cache@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Compute pack cache key
        id: pack-key
        run: |
          hash=$( { git ls-tree HEAD vendor/rs-sdk; sha256sum patches/rs-sdk-working.patch .gitmodules; } | sha256sum | cut -d' ' -f1 )
          echo "key=engine-pack-v3-${{ runner.os }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore packed game assets
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Pack the public game assets
        id: pack
        timeout-minutes: 10
        working-directory: vendor/rs-sdk/server/engine
        run: |
          if [ "${{ steps.pack-cache.outputs.cache-hit }}" = "true" ] \
             && [ -s data/pack/server/script.dat ] \
             && [ -s data/pack/server/script.idx ] \
             && [ -s data/pack/main_file_cache.dat ] \
             && [ -s data/pack/main_file_cache.idx0 ] \
             && [ -s data/pack/main_file_cache.idx4 ] \
             && [ -s data/pack/ondemand.zip ] \
             && [ -s data/pack/client/config ] \
             && { [ -s data/pack/.cache/maps-server.zip ] || [ -d data/pack/server/maps ]; }; then
            echo "Using cached packed assets"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf data/pack
            bun run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save packed game assets
        if: steps.pack.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Bind the proof to its source
        run: |
          mkdir -p .practice/pvp-sweep
          git rev-parse HEAD > .practice/pvp-sweep/source.txt
          sha256sum scripts/pk.ts scripts/pk-spar.ts scripts/measure/pk-escape-proof.ts scripts/measure/pk-spear-proof.ts scripts/measure/aio-bench-cases.ts patches/rs-sdk-working.patch >> .practice/pvp-sweep/source.txt
      - name: Run this shard of the complete PvP sweep in bounded batches
        timeout-minutes: 45
        run: |
          set -o pipefail
          bun scripts/measure/pvp-sweep.ts --parallel 4 --budget 3.5 --shard ${{ matrix.shard }}/4 | tee .practice/pvp-sweep/full.log
      - name: Run the first AIO smoke group
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun run bench '^quester:quest:(cook|imp|doric|gobdip|sheep|hetty|rj)$' --smoke --parallel 1 --budget 10 | tee .practice/pvp-sweep/smoke-a.log
      - name: Run the second AIO smoke group
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun run bench '^(?!quester:quest:(cook|imp|doric|gobdip|sheep|hetty|rj)$)' --smoke --parallel 1 --budget 10 | tee .practice/pvp-sweep/smoke-b.log
      - name: Retain the source-bound PvP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvp-practice-shard-${{ matrix.shard }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .practice/pvp-sweep/**
            .practice/sim/aio-bench/last.json
            .practice/sim/aio-bench/output/*.log
            .practice/sim/logs/engine-aiobench-*.log
  # `bun tools/hosted-bench.ts '<pattern> ...' [--seeds 7,8,9] [--args '--profile']` starts these two jobs and prints
  # the result of each case. The plan gives one runner to each pattern and seed.
  bench-plan:
    if: inputs.bench_pattern != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Validate args and emit the runner matrix with preinstalled Node to avoid checkout/setup-bun latency.
      - id: plan
        run: |
          node -e '
            const decodeB64 = (spec) => {
              const m = /^([A-Z][A-Z0-9_]*)=([A-Za-z0-9+\/_-]+={0,2})$/.exec(spec);
              if (!m) throw new Error(`--set-b64 needs KEY=base64, got ${spec}`);
              const norm = m[2].replace(/-/g, "+").replace(/_/g, "/");
              const raw = norm.replace(/=+$/, "");
              if (!raw.length || raw.length % 4 === 1) throw new Error(`--set-b64 invalid base64 for ${m[1]}`);
              const padded = raw + "=".repeat((4 - (raw.length % 4)) % 4);
              if ((norm.includes("=") && norm !== padded) || Buffer.from(padded, "base64").toString("base64") !== padded) {
                throw new Error(`--set-b64 invalid base64 for ${m[1]}`);
              }
            };
            const argsList = (process.env.BENCH_ARGS || "").split(/\s+/).filter(Boolean);
            let batch = 1, seedJobs = 1;
            for (let i = 0; i < argsList.length; i++) {
              const a = argsList[i];
              if (a === "--set") { if (!/^[A-Z][A-Z0-9_]*=[\w.,:+@\/-]*$/.test(argsList[++i] || "")) throw new Error("invalid --set"); }
              else if (a === "--set-b64") decodeB64(argsList[++i] || "");
              else if (a === "--seed-jobs") { const v = argsList[++i] || ""; if (!/^[1-4]$/.test(v)) throw new Error("invalid --seed-jobs"); seedJobs = Number(v); }
              else if (a === "--batch") { const v = argsList[++i] || ""; if (!/^[1-8]$/.test(v)) throw new Error("invalid --batch"); batch = Number(v); }
              else if (!["--profile", "--no-keep", "--all", "--smoke", "--wall-clock"].includes(a)) throw new Error(`argument not allowed: ${a}`);
            }
            const patterns = (process.env.BENCH_PATTERN || "").split(/\s+/).filter(Boolean);
            const seeds = ((process.env.BENCH_SEEDS || "").trim() || "7").split(",").map(s => s.trim());
            if (!patterns.length) throw new Error("no bench pattern");
            for (const p of patterns) { if (p.startsWith("-")) throw new Error("pattern starts with -"); new RegExp(p); }
            if (seeds.some(s => !/^\d{1,9}$/.test(s))) throw new Error("invalid seeds");
            const pGroups = [], sGroups = [];
            for (let i = 0; i < patterns.length; i += batch) pGroups.push(patterns.slice(i, i + batch));
            for (let i = 0; i < seeds.length; i += seedJobs) sGroups.push(seeds.slice(i, i + seedJobs));
            const rows = [];
            let multiIdx = 0;
            for (let pi = 0; pi < pGroups.length; pi++) {
              const g = pGroups[pi];
              const pattern = g.length === 1 ? g[0] : g.map(p => `(?:${p})`).join("|");
              for (const ss of sGroups) {
                if (ss.length === 1 && g.length === 1) rows.push({ id: `p${pi + 1}-s${ss[0]}`, pattern, seed: ss[0] });
                else if (ss.length === 1) rows.push({ id: `p${pi + 1}-s${ss[0]}`, pattern, seed: ss[0], parallel: String(Math.min(4, g.length)) });
                else rows.push({ id: `m${++multiIdx}`, pattern, seed: ss[0], seeds: ss.join(","), seedJobs: String(Math.min(4, ss.length)) });
              }
            }
            if (rows.length > 40) throw new Error(`too many runners: ${rows.length}`);
            console.log(`matrix=${JSON.stringify({ include: rows })}`);
          ' >> "$GITHUB_OUTPUT"
        env:
          BENCH_PATTERN: ${{ inputs.bench_pattern }}
          BENCH_SEEDS: ${{ inputs.bench_seeds }}
          BENCH_ARGS: ${{ inputs.bench_args }}
  bench-cases:
    needs: bench-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bench-plan.outputs.matrix) }}
    name: bench-cases ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bench_ref }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Prepare the pinned practice dependencies
        run: bun tools/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Restoring read-only
      # avoids redundant cache uploads at the end of every bench job.
      - name: Restore the route caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Compute pack cache key
        id: pack-key
        run: |
          hash=$( { git ls-tree HEAD vendor/rs-sdk; sha256sum patches/rs-sdk-working.patch .gitmodules; } | sha256sum | cut -d' ' -f1 )
          echo "key=engine-pack-v3-${{ runner.os }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore packed game assets
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Pack the public game assets
        id: pack
        timeout-minutes: 10
        working-directory: vendor/rs-sdk/server/engine
        run: |
          if [ "${{ steps.pack-cache.outputs.cache-hit }}" = "true" ] \
             && [ -s data/pack/server/script.dat ] \
             && [ -s data/pack/server/script.idx ] \
             && [ -s data/pack/main_file_cache.dat ] \
             && [ -s data/pack/main_file_cache.idx0 ] \
             && [ -s data/pack/main_file_cache.idx4 ] \
             && [ -s data/pack/ondemand.zip ] \
             && [ -s data/pack/client/config ] \
             && { [ -s data/pack/.cache/maps-server.zip ] || [ -d data/pack/server/maps ]; }; then
            echo "Using cached packed assets"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf data/pack
            bun run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save packed game assets
        if: steps.pack.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Run the named bench cases
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p .practice/bench-cases
          # Decode --set-b64 KEY=<base64> into --set KEY=<value> without bash word-splitting on JSON values.
          # The plan job checked each extra argument (tools/hosted-bench.ts checkArgs).
          bun -e '
            const raw = (process.env.BENCH_ARGS ?? "").split(/\s+/).filter(Boolean);
            const matrixSeeds = process.env.MATRIX_SEEDS ?? "";
            const matrixSeedJobs = process.env.MATRIX_SEED_JOBS ?? "";
            const matrixParallel = process.env.MATRIX_PARALLEL ?? "";
            const args = [process.env.BENCH_PATTERN!];
            if (matrixSeeds.includes(",")) {
              args.push("--seeds", matrixSeeds, "--seed-jobs", matrixSeedJobs || "1");
            } else {
              args.push("--seed", process.env.BENCH_SEED!);
              if (matrixParallel && Number(matrixParallel) > 1) args.push("--parallel", matrixParallel);
              else if (!raw.includes("--profile")) args.push("--parallel", "4");
            }
            args.push("--budget", "10");
            for (let i = 0; i < raw.length; i++) {
              const a = raw[i]!;
              if (a === "--set-b64") {
                const spec = raw[++i] ?? "";
                const eq = spec.indexOf("=");
                if (eq < 1) throw new Error(`invalid --set-b64: ${spec}`);
                const b64 = spec.slice(eq + 1).replace(/-/g, "+").replace(/_/g, "/");
                const val = Buffer.from(b64, "base64").toString("utf8");
                args.push("--set", `${spec.slice(0, eq)}=${val}`);
              } else if (a === "--seed-jobs" || a === "--batch") {
                i++;
              } else {
                args.push(a);
              }
            }
            const p = Bun.spawnSync(["bun", "run", "bench", ...args], { stdio: ["inherit", "inherit", "inherit"] });
            process.exit(p.exitCode ?? 1);
          ' | tee .practice/bench-cases/bench.log
        env:
          BENCH_PATTERN: ${{ matrix.pattern }}
          BENCH_SEED: ${{ matrix.seed }}
          MATRIX_SEEDS: ${{ matrix.seeds }}
          MATRIX_SEED_JOBS: ${{ matrix.seedJobs }}
          MATRIX_PARALLEL: ${{ matrix.parallel }}
          BENCH_ARGS: ${{ inputs.bench_args }}
          BENCH_OUT: .practice/bench-cases/cases.json
          BENCH_SKIP_PLANNERS: '1'
      - name: Retain the bench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.id }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .practice/bench-cases/**
            .practice/sim/aio-bench/output*/*.log
            .practice/sim/aio-bench/profile/**
  # The key of the saved walk lengths: a set of real trips planned alone and with shared lengths gives equal plans
  # (scripts/measure/route-key-parity.ts).
  route-key-parity:
    # A dispatch for bench cases or for one measure script alone does not need it.
    if: inputs.bench_pattern == '' && inputs.measure_script == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Prepare the pinned dependencies
        run: bun tools/worktree-setup.ts
      - name: Restore the route caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Plan each trip alone and with shared walk lengths
        timeout-minutes: 15
        run: |
          bun scripts/measure/route-key-parity.ts
  # One script of scripts/measure/ on a clean runner (for example route-memory.ts: RSS, heap and time of the route steps).
  # Dispatch: gh workflow run CI --ref <branch> -f measure_script=scripts/measure/route-memory.ts
  measure:
    if: inputs.measure_script != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEASURE_SCRIPT: ${{ inputs.measure_script }}
      MEASURE_ARGS: ${{ inputs.measure_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Prepare the pinned dependencies
        run: bun tools/worktree-setup.ts --bench
      - name: Restore the route caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Compute pack cache key
        id: pack-key
        run: |
          hash=$( { git ls-tree HEAD vendor/rs-sdk; sha256sum patches/rs-sdk-working.patch .gitmodules; } | sha256sum | cut -d' ' -f1 )
          echo "key=engine-pack-v3-${{ runner.os }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore packed game assets
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Pack the public game assets
        id: pack
        timeout-minutes: 10
        working-directory: vendor/rs-sdk/server/engine
        run: |
          if [ "${{ steps.pack-cache.outputs.cache-hit }}" = "true" ] \
             && [ -s data/pack/server/script.dat ] \
             && [ -s data/pack/server/script.idx ] \
             && [ -s data/pack/main_file_cache.dat ] \
             && [ -s data/pack/main_file_cache.idx0 ] \
             && [ -s data/pack/main_file_cache.idx4 ] \
             && [ -s data/pack/ondemand.zip ] \
             && [ -s data/pack/client/config ] \
             && { [ -s data/pack/.cache/maps-server.zip ] || [ -d data/pack/server/maps ]; }; then
            echo "Using cached packed assets"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf data/pack
            bun run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save packed game assets
        if: steps.pack.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Run the measure script
        timeout-minutes: 15
        run: |
          case "$MEASURE_SCRIPT" in
            scripts/measure/[A-Za-z0-9_-]*.ts) ;;
            *) echo "measure_script must be a file of scripts/measure/: $MEASURE_SCRIPT"; exit 1 ;;
          esac
          case "$MEASURE_SCRIPT" in *..*) echo "no .. in the path"; exit 1 ;; esac
          [ -f "$MEASURE_SCRIPT" ] || { echo "no such script: $MEASURE_SCRIPT"; exit 1; }
          bun "$MEASURE_SCRIPT" $MEASURE_ARGS
      - name: Retain the measure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ github.run_id }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .practice/hosted-rehearse/**
            .practice/specialist-launch/**
  # The test files run in parts on several runners at once (tools/test-shards.ts --part); part 1 also runs the other checks.
  linux:
    if: inputs.bench_pattern == '' && inputs.measure_script == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Apply checked-in SDK setup patch
        run: git -C vendor/rs-sdk apply ../../patches/rs-sdk-working.patch
      - name: Install dependencies from the lockfiles
        run: |
          bun install --frozen-lockfile
          (cd vendor/rs-sdk && bun install --frozen-lockfile --production)
          (cd vendor/rs-sdk/server/webclient && bun install --frozen-lockfile)
      # The caches under .practice/cache (route legs, the path snapshot, built tables) key each entry by the data it was
      # built from, so an older copy is safe. A cold route-leg cache made world-golden.test.ts take 188 s here.
      - name: Restore the content-keyed caches
        uses: actions/cache@v4
        with:
          path: .practice/cache
          key: practice-cache-${{ runner.os }}-part${{ matrix.part }}-${{ hashFiles('knowledge/**/*.json', '.gitmodules', 'patches/*.patch') }}
          restore-keys: practice-cache-${{ runner.os }}-part${{ matrix.part }}-
      - run: bun run check-pin
        if: matrix.part == 1
      # A Windows checkout (CRLF in the SDK submodule) and this runner give one release for one commit
      # (packages/core/src/release-digest.ts). Compare the line with `bun packages/core/src/worker-release.ts scripts/ranged-train.ts` on the PC.
      - name: Print the release of one worker
        if: matrix.part == 1
        run: |
          bun packages/core/src/worker-release.ts scripts/ranged-train.ts
      - name: Typecheck (tsc needs more than the default Node heap for this repo)
        if: matrix.part == 1
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bun tools/test-shards.ts --part $TEST_PART ./scripts ./packages ./tools
        env:
          TEST_PART: ${{ matrix.part }}/2
      # The dashboard tests alone too: in the full run another test's globals (window) can hide a missing stub.
      - run: bun test ./packages/dashboard
        if: matrix.part == 1
  # The gate reads the one-line bun run/test steps above. This entry calls the script directly to avoid recursion.
  windows:
    if: inputs.bench_pattern == '' && inputs.measure_script == ''
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Keep SDK patch line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Apply checked-in SDK setup patch
        run: git -C vendor/rs-sdk apply ../../patches/rs-sdk-working.patch
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --production
        working-directory: vendor/rs-sdk
      - run: bun install --frozen-lockfile
        working-directory: vendor/rs-sdk/server/webclient
      - name: Restore the content-keyed caches
        uses: actions/cache@v4
        with:
          path: .practice/cache
          key: practice-cache-${{ runner.os }}-part${{ matrix.part }}-${{ hashFiles('knowledge/**/*.json', '.gitmodules', 'patches/*.patch') }}
          restore-keys: practice-cache-${{ runner.os }}-part${{ matrix.part }}-
      - name: Full Windows gate, one part of the test files
        run: bun tools/ci-gate.ts --full --part ${{ matrix.part }}/6
  preparation-practice:
    if: inputs.preparation_practice
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'vendor/rs-sdk/bun.lock', 'vendor/rs-sdk/server/engine/bun.lock', 'vendor/rs-sdk/server/webclient/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: Prepare the pinned practice dependencies
        run: bun tools/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Each file is bound to
      # the data named in the key and is checked on read. Without them each route search measures every leg again.
      - name: Restore the route caches
        uses: actions/cache@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Compute pack cache key
        id: pack-key
        run: |
          hash=$( { git ls-tree HEAD vendor/rs-sdk; sha256sum patches/rs-sdk-working.patch .gitmodules; } | sha256sum | cut -d' ' -f1 )
          echo "key=engine-pack-v3-${{ runner.os }}-${hash}" >> "$GITHUB_OUTPUT"
      - name: Restore packed game assets
        id: pack-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Pack the public game assets
        id: pack
        timeout-minutes: 10
        working-directory: vendor/rs-sdk/server/engine
        run: |
          if [ "${{ steps.pack-cache.outputs.cache-hit }}" = "true" ] \
             && [ -s data/pack/server/script.dat ] \
             && [ -s data/pack/server/script.idx ] \
             && [ -s data/pack/main_file_cache.dat ] \
             && [ -s data/pack/main_file_cache.idx0 ] \
             && [ -s data/pack/main_file_cache.idx4 ] \
             && [ -s data/pack/ondemand.zip ] \
             && [ -s data/pack/client/config ] \
             && { [ -s data/pack/.cache/maps-server.zip ] || [ -d data/pack/server/maps ]; }; then
            echo "Using cached packed assets"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf data/pack
            bun run build
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save packed game assets
        if: steps.pack.outputs.built == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/rs-sdk/server/engine/data/pack
          key: ${{ steps.pack-key.outputs.key }}
      - name: Prove shared preparation and funded batch behavior
        timeout-minutes: 10
        run: |
          bun run bench '^(extra:(bank-preflight-tanning-short|loot-wildcard-ignore|hunt-restock-partial-glory|owned-bank-ring-consumer|progressive-cooking-entry|bank-job-cook-lobster|inventory-best-effort|catalog-finite-producer|catalog-gather-short)|fighter:ranged-starter)$' --profile --budget 10
        env:
          BENCH_OUT: .practice/shared-preparation/cases.json
      - name: Prove remote supply and artisan entry cases
        timeout-minutes: 10
        run: |
          bun run bench '^extra:(catalog-cut-sapphire|catalog-dommik-tools|remote-supply-producer|owned-bank-observation)$' --profile --budget 10
        env:
          BENCH_OUT: .practice/shared-preparation/supply-artisan.json
          ROUTE_TRACE: '1'
      - name: Run the first AIO smoke group
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bun run bench '^quester:quest:(cook|imp|doric|gobdip|sheep|hetty|rj)$' --smoke --profile --budget 10
        env:
          BENCH_OUT: .practice/shared-preparation/smoke-a.json
      - name: Run the second AIO smoke group
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          bun run bench '^(?!quester:quest:(cook|imp|doric|gobdip|sheep|hetty|rj)$)' --smoke --profile --budget 10
        env:
          BENCH_OUT: .practice/shared-preparation/smoke-b.json
      - name: Retain preparation and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-preparation-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .practice/shared-preparation/*.json
            .practice/artisan-native/**
            .practice/sim/aio-bench/output/*.log
            .practice/sim/aio-bench/profile/*
            .practice/sim/logs/engine-aiobench-*.log
