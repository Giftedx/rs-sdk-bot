name: CI
# The local gate proves a change: `bun scripts/ci-gate.ts --post` runs the check steps below on the PC and posts the
# `local-gate` status on HEAD. This hosted workflow uses standard runners, which cost no minutes on a public
# repository. Nothing starts it but a person: the Actions tab, or `gh workflow run CI --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      native_practice:
        description: Run the quest and fleet trade practice proofs
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply checked-in SDK setup patch
        run: git -C vendor/rs-sdk apply ../../patches/rs-sdk-working.patch
      - name: Install dependencies from the lockfiles
        run: |
          bun install --frozen-lockfile
          (cd vendor/rs-sdk && bun install --frozen-lockfile --production)
          (cd vendor/rs-sdk/server/webclient && bun install --frozen-lockfile)
      - run: bun run check-pin
      - name: Typecheck (tsc needs more than the default Node heap for this repo)
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bun test ./scripts ./packages
      # The dashboard tests alone too: in the full run another test's globals (window) can hide a missing stub.
      - run: bun test ./packages/dashboard
  # The gate reads the one-line bun run/test steps above. This entry calls the script directly to avoid recursion.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Keep SDK patch line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply checked-in SDK setup patch
        run: git -C vendor/rs-sdk apply ../../patches/rs-sdk-working.patch
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --production
        working-directory: vendor/rs-sdk
      - run: bun install --frozen-lockfile
        working-directory: vendor/rs-sdk/server/webclient
      - name: Full Windows gate
        run: bun scripts/ci-gate.ts --full
  native-practice:
    if: inputs.native_practice
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare the pinned practice dependencies
        run: bun scripts/worktree-setup.ts --bench
      - name: Pack the public game assets
        id: pack
        timeout-minutes: 10
        working-directory: vendor/rs-sdk/server/engine
        run: |
          bun run build
      - name: Qualify both Scorpion combat cases and refusal
        id: quest
        timeout-minutes: 35
        run: bun packages/router/src/delivery-cli.ts quest-sweep
      - name: Prove full-pack fleet receiver capacity
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        timeout-minutes: 5
        run: bun packages/practice/src/fleet-trade-capacity-proof.ts
      - name: Retain the source-bound practice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-practice-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .practice/deliveries/quest-sweep-*/report.json
            .practice/deliveries/quest-sweep-*/native.json
            .practice/deliveries/quest-sweep-*/results.json
            .practice/deliveries/quest-sweep-*/*.log
            .practice/deliveries/quest-sweep-*/*.sav
            .practice/fleet-trade-capacity-*/report.json
            .practice/fleet-trade-capacity-*/native.json
            .practice/fleet-trade-capacity-*/failure.json
            .practice/fleet-trade-capacity-*/transfer-observed.json
            .practice/fleet-trade-capacity-*/transfer-result.json
            .practice/fleet-trade-capacity-*/before-*.sav
            .practice/fleet-trade-capacity-*/after-*.sav
            .practice/fleet-trade-capacity-*/transfer.log
            .practice/fleet-trade-capacity-*/transfer.err
            .practice/fleet-trade-capacity-*/auth-*.log
            .practice/fleet-trade-capacity-*/auth-*.err
