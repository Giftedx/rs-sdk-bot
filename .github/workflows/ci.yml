name: CI
# Hosted minutes are limited, so the check starts only where it decides something:
# - a pull request that is ready for review (a draft does not start it; "Ready for review" does);
# - a manual start (Actions tab, or `gh workflow run CI --ref <branch>`).
# A push to master does not start it: the pull request ran the same checks on the merge result.
# A newer push cancels the older run of the same pull request.
# A pull request that changes only documents, research or fleet data runs the no-diary check alone.
# When runners are out of minutes, `bun scripts/ci-gate.ts --post` runs the checks on the PC and posts `local-gate`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A pull request checkout is the merge commit: its first parent is the base, so the diff is the change.
      - name: Determine if the change touches code
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD^1 HEAD | grep -qvE '(\.md$|^swarm(\.[a-z]+)?\.json$|^(docs|research|fleet)/.*\.(json|txt|csv)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: No-diary check for a change with no code
        if: steps.scope.outputs.code == 'false'
        run: bun scripts/check-no-diary.ts
      - name: Check out the SDK and apply the checked-in SDK setup patch
        if: steps.scope.outputs.code == 'true'
        run: |
          git submodule update --init --recursive
          git -C vendor/rs-sdk apply ../../patches/rs-sdk-working.patch
      - name: Install dependencies without rewriting the root lockfile
        if: steps.scope.outputs.code == 'true'
        run: |
          bun install --no-save
          (cd vendor/rs-sdk && bun install --frozen-lockfile --production)
          (cd vendor/rs-sdk/server/webclient && bun install --frozen-lockfile)
      - if: steps.scope.outputs.code == 'true'
        run: bun run check-pin
      - name: Typecheck (tsc needs more than the default Node heap for this repo)
        if: steps.scope.outputs.code == 'true'
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - if: steps.scope.outputs.code == 'true'
        run: bun test ./scripts ./packages
      # The dashboard tests alone too: in the full run another test's globals (window) can hide a missing stub.
      - if: steps.scope.outputs.code == 'true'
        run: bun test ./packages/dashboard
