name: Progression practice
on:
  workflow_dispatch:
    inputs:
      capabilities:
        description: Capability ids separated by spaces, or all. Each one is qualified on its own runner (empty runs the Ranged jobs)
        type: string
        required: false
        default: ''
  workflow_call:
  # Each merge makes the method proofs of its commit on a clean runner. The PC adopts them with
  # `bun packages/router/src/adopt-proofs.ts` and runs no practice engine for them.
  push:
    branches: [master]
# A burst of merges: the proof of the newest commit of master is the one the PC adopts, so a newer push ends the run
# of the commit before it. A dispatch never ends another run.
concurrency:
  group: ${{ github.event_name == 'push' && 'progression-proofs-master' || format('progression-{0}', github.run_id) }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # A full round of capability qualifications: one delivery (regression, practice and consumer checks) on one clean
  # runner for each capability, all at one time. The PC runs them one after the other on one practice turn.
  capability-plan:
    if: inputs.capabilities != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          if [ "$CAPABILITIES" = "all" ]; then list=$(ls packages/router/tasks | sed -n 's/[.]json$//p'); else list="$CAPABILITIES"; fi
          echo "matrix=$(echo $list | tr ' ' '\n' | grep -E '^[-a-z0-9]+$' | jq -R . | jq -sc '{capability: .}')" >> "$GITHUB_OUTPUT"
        env:
          CAPABILITIES: ${{ inputs.capabilities }}
  capability:
    needs: capability-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.capability-plan.outputs.matrix) }}
    name: capability ${{ matrix.capability }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare pinned practice dependencies
        run: bun scripts/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Each file is bound to
      # the data named in the key and is checked on read. Without them each route search measures every leg again.
      - name: Restore the route caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ matrix.capability }}-${{ github.run_id }}
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ matrix.capability }}-
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Pack game assets
        working-directory: vendor/rs-sdk/server/engine
        timeout-minutes: 10
        run: bun run build
      - name: Qualify the capability
        timeout-minutes: 35
        run: bun packages/router/src/delivery-cli.ts "$CAPABILITY"
        env:
          CAPABILITY: ${{ matrix.capability }}
      # The cache is saved when the job fails too: a capability whose routes are cold fails on its first runs (a search of
      # 45 s is 300 ticks of a native 150 ms engine), and a cache that only a green job saves is never made for it.
      - name: Save the route caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ matrix.capability }}-${{ github.run_id }}
      - name: Retain the delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-${{ matrix.capability }}-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
          path: |
            .practice/deliveries/**
  qualification:
    if: inputs.capabilities == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare pinned practice dependencies
        run: bun scripts/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Each file is bound to
      # the data named in the key and is checked on read. Without them each route search measures every leg again.
      - name: Restore the route caches
        uses: actions/cache@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Pack game assets
        working-directory: vendor/rs-sdk/server/engine
        timeout-minutes: 10
        run: bun run build
      - name: Qualify complete Ranged delivery contract
        timeout-minutes: 29
        run: bun packages/router/src/delivery-cli.ts ranged-train
      - name: Retain full qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-qualification-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .practice/deliveries/**
            .practice/sim/aio-bench/output/**
            .practice/sim/aio-bench/profile/**
            .practice/progression-ranged/**
            .practice/sim/logs/engine-*.log
  ranged:
    # The three-seed route comparison is for a dispatch, not for each merge.
    if: github.event_name != 'push' && inputs.capabilities == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 8, 9]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare pinned worker and engine
        run: bun scripts/worktree-setup.ts --bench
      # The pathfinder snapshot, the area labels and the measured walk lengths (.practice/cache). Each file is bound to
      # the data named in the key and is checked on read. Without them each route search measures every leg again.
      - name: Restore the route caches
        uses: actions/cache@v4
        with:
          path: |
            .practice/cache/rsmod-pathfinding.snap
            .practice/cache/route-areas.bin
            .practice/cache/route-legs-v2.sqlite*
          key: route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: |
            route-caches-v2-${{ runner.os }}-${{ hashFiles('vendor/rs-sdk/server/vendor/rsmod-pathfinder/rsmod_bg.wasm', 'vendor/rs-sdk/sdk/collision-data.json', 'vendor/rs-sdk/sdk/pathfinding.ts', 'knowledge/doors.json', 'knowledge/npcs.json') }}-
      - name: Pack game assets
        working-directory: vendor/rs-sdk/server/engine
        timeout-minutes: 10
        run: bun run build
      - name: Compare matched whole Ranged jobs
        timeout-minutes: 11
        run: bun run bench '^extra:progression-ranged-(chickens|troopers|adaptive)$' --seed ${{ matrix.seed }} --profile --budget 10
        env:
          BENCH_OUT: .practice/progression-system/seed-${{ matrix.seed }}.json
      - name: Prove the selected route through the live target
        timeout-minutes: 11
        run: bun run bench '^extra:progression-ranged-adaptive85$' --seed ${{ matrix.seed }} --profile --budget 10
        env:
          BENCH_OUT: .practice/progression-system/target85-seed-${{ matrix.seed }}.json
      - name: Retain raw source-bound proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-${{ github.sha }}-seed-${{ matrix.seed }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .practice/progression-system/*.json
            .practice/sim/aio-bench/output/**
            .practice/sim/aio-bench/profile/**
            .practice/progression-ranged/**
            .practice/sim/logs/engine-aiobench-*.log
  compare:
    if: github.event_name != 'push'
    needs: ranged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: progression-${{ github.sha }}-seed-*
          path: .practice/progression-system/artifacts
          merge-multiple: true
      - name: Require three matched faster-route results
        run: bun packages/planner/src/progression-comparison.ts .practice/progression-system/artifacts
